<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mynews — 知识笔记处理器</title>
<style>
/* ============ Design Tokens ============ */
:root {
  --bg: #f6f7fd;
  --surface: rgba(255, 255, 255, .78);
  --surface-solid: #ffffff;
  --surface-2: #f3f4fb;
  --glass-border: rgba(255, 255, 255, .75);
  --text: #191c31;
  --text-2: #5d6280;
  --text-3: #9ba1bf;
  --border: #e7e9f4;
  --border-strong: #d3d7ec;
  --accent: #6366f1;
  --accent-2: #a855f7;
  --accent-3: #ec4899;
  --accent-soft: #eeeffd;
  --green: #10b981;
  --red: #f43f5e;
  --orange: #f59e0b;
  --blue: #3b82f6;
  --radius: 18px;
  --radius-sm: 11px;
  --shadow-sm: 0 1px 2px rgba(25, 28, 49, .05), 0 2px 8px rgba(25, 28, 49, .05);
  --shadow-md: 0 8px 30px rgba(25, 28, 49, .09), 0 2px 8px rgba(25, 28, 49, .05);
  --shadow-lg: 0 24px 60px rgba(25, 28, 49, .16), 0 8px 20px rgba(25, 28, 49, .08);
  --shadow-glow: 0 8px 32px rgba(99, 102, 241, .35);
  --code-bg: #131627;
  --code-text: #dfe3f6;
  --mark-bg: #fde68a;
  --mark-text: #92400e;
  --grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 45%, #d946ef 100%);
  --grad-text: linear-gradient(120deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
  --tag-colors: #6366f1, #8b5cf6, #d946ef, #0ea5e9, #10b981, #f59e0b, #f43f5e;
}
body.dark {
  --bg: #0b0d1a;
  --surface: rgba(23, 26, 46, .72);
  --surface-solid: #171a2e;
  --surface-2: #1d2039;
  --glass-border: rgba(255, 255, 255, .09);
  --text: #e7e9f8;
  --text-2: #a2a7c6;
  --text-3: #6c7194;
  --border: #262a4b;
  --border-strong: #363b66;
  --accent: #818cf8;
  --accent-2: #c084fc;
  --accent-3: #f472b6;
  --accent-soft: #23264c;
  --green: #34d399;
  --red: #fb7185;
  --orange: #fbbf24;
  --blue: #60a5fa;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --shadow-md: 0 8px 30px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.55), 0 8px 20px rgba(0,0,0,.35);
  --shadow-glow: 0 8px 32px rgba(129, 140, 248, .3);
  --code-bg: #0a0c16;
  --code-text: #d6daef;
  --mark-bg: #4d3b00;
  --mark-text: #fcd34d;
  --grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 45%, #d946ef 100%);
  --grad-text: linear-gradient(120deg, #818cf8 0%, #a78bfa 50%, #f472b6 100%);
}

/* ============ Base ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Display", "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  color: var(--text); min-height: 100vh; position: relative; overflow-x: hidden;
  background: var(--bg);
  transition: background .4s, color .4s;
  -webkit-font-smoothing: antialiased;
}
/* ambient gradient orbs */
body::before, body::after {
  content: ""; position: fixed; border-radius: 50%; filter: blur(90px); z-index: -1; pointer-events: none;
  transition: background .4s;
}
body::before {
  width: 560px; height: 560px; top: -180px; right: -120px;
  background: radial-gradient(circle, rgba(99, 102, 241, .16), transparent 65%);
}
body::after {
  width: 480px; height: 480px; bottom: -160px; left: -140px;
  background: radial-gradient(circle, rgba(217, 70, 239, .11), transparent 65%);
}
body.dark::before { background: radial-gradient(circle, rgba(99, 102, 241, .22), transparent 65%); }
body.dark::after { background: radial-gradient(circle, rgba(217, 70, 239, .16), transparent 65%); }

/* ============ Header ============ */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border-bottom: 1px solid var(--border);
  padding: 13px 28px; display: flex; align-items: center; gap: 14px;
  transition: background .4s, border-color .4s;
}
.brand { display: flex; align-items: center; gap: 13px; flex: 1; }
.brand-logo {
  width: 40px; height: 40px; border-radius: 12px; background: var(--grad);
  display: flex; align-items: center; justify-content: center; color: #fff;
  box-shadow: var(--shadow-glow); position: relative; overflow: hidden;
}
.brand-logo::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
  animation: shine 3.2s ease-in-out infinite;
}
@keyframes shine { 0%, 55% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
.brand-logo svg { width: 21px; height: 21px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text h1 {
  font-size: 17px; font-weight: 800; letter-spacing: -.3px;
  background: var(--grad-text); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.brand-text small { font-size: 11px; color: var(--text-3); font-weight: 500; letter-spacing: .5px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 39px; height: 39px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .22s; box-shadow: var(--shadow-sm); backdrop-filter: blur(8px);
}
.icon-btn:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-2px) rotate(-6deg); box-shadow: 0 6px 16px rgba(99,102,241,.18); }
.icon-btn svg { width: 18px; height: 18px; }

/* ============ Layout ============ */
.container { max-width: 880px; margin: 0 auto; padding: 30px 20px 70px; }
.card {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--glass-border); padding: 26px; margin-bottom: 24px;
  box-shadow: var(--shadow-md); backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: background .4s, box-shadow .3s, transform .3s, border-color .4s;
}
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.card-title {
  font-size: 15px; font-weight: 800; margin-bottom: 18px;
  display: flex; align-items: center; gap: 11px; letter-spacing: .2px;
}
.card-title .title-icon {
  width: 34px; height: 34px; border-radius: 11px; background: var(--grad);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  color: #fff; box-shadow: var(--shadow-glow); flex-shrink: 0;
}
.card-title .title-sub { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: auto; }

/* ============ Segmented tabs ============ */
.input-tabs {
  display: flex; gap: 4px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 13px; padding: 4px; position: relative;
}
.tab-btn {
  flex: 1; padding: 10px 14px; border: none; background: transparent; border-radius: 10px;
  cursor: pointer; font-size: 13px; font-weight: 700; color: var(--text-2);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all .25s; font-family: inherit; position: relative; z-index: 1;
}
.tab-btn .tab-ico { font-size: 15px; transition: transform .25s; }
.tab-btn:hover { color: var(--text); }
.tab-btn:hover .tab-ico { transform: scale(1.2); }
.tab-btn.active {
  background: var(--surface-solid); color: var(--accent);
  box-shadow: 0 2px 10px rgba(25, 28, 49, .1), 0 0 0 1px var(--border);
}
body.dark .tab-btn.active { box-shadow: 0 2px 10px rgba(0,0,0,.4), 0 0 0 1px var(--border-strong); }
.tab-pane { display: none; padding-top: 18px; }
.tab-pane.active { display: block; animation: fadeUp .3s ease; }

/* ============ Inputs ============ */
.field { position: relative; }
textarea, input[type="text"] {
  width: 100%; padding: 15px 17px; border: 1.5px solid var(--border);
  border-radius: 13px; font-size: 14px; font-family: inherit;
  background: var(--surface-solid); color: var(--text); line-height: 1.75;
  transition: border .22s, box-shadow .22s, background .35s; outline: none; resize: vertical;
}
textarea::placeholder, input::placeholder { color: var(--text-3); }
textarea { min-height: 160px; padding-bottom: 34px; }
textarea:focus, input[type="text"]:focus {
  border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-md);
}
.char-count {
  position: absolute; right: 14px; bottom: 12px; font-size: 11px; color: var(--text-3);
  font-weight: 600; pointer-events: none; font-variant-numeric: tabular-nums;
}
.hint-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.hint-chip {
  font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--text-2); background: var(--surface-2);
  display: inline-flex; align-items: center; gap: 5px; transition: all .2s;
}
.hint-chip.allow { border-color: color-mix(in srgb, var(--green) 35%, transparent); color: var(--green); background: color-mix(in srgb, var(--green) 8%, transparent); }
.hint-chip.deny { border-color: color-mix(in srgb, var(--red) 30%, transparent); color: var(--red); background: color-mix(in srgb, var(--red) 7%, transparent); }
.hint-chip:hover { transform: translateY(-1px); }

/* ============ Drop zone ============ */
.drop-zone {
  border: 2px dashed var(--border-strong); border-radius: 15px; padding: 42px 24px;
  text-align: center; cursor: pointer; transition: all .28s; background: var(--surface-2);
  position: relative; overflow: hidden;
}
.drop-zone::before {
  content: ""; position: absolute; inset: -2px; border-radius: 15px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  background-size: 200% 100%; opacity: 0; transition: opacity .3s;
}
.drop-zone:hover::before, .drop-zone.dragover::before { opacity: .25; animation: flow 2s linear infinite; }
@keyframes flow { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.01); }
.drop-zone .dz-ico { font-size: 42px; margin-bottom: 10px; display: block; animation: floaty 3s ease-in-out infinite; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.drop-zone .dz-main { font-size: 14px; color: var(--text-2); font-weight: 600; }
.drop-zone .dz-sub { font-size: 12px; color: var(--text-3); margin-top: 6px; }

/* ============ Buttons ============ */
.btn-row { display: flex; gap: 16px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
.btn {
  padding: 13px 28px; border: none; border-radius: 13px; font-size: 14px; font-weight: 800;
  cursor: pointer; transition: all .25s; display: inline-flex; align-items: center; gap: 9px;
  font-family: inherit; letter-spacing: .3px; position: relative; overflow: hidden;
}
.btn-primary {
  background: var(--grad); color: #fff; box-shadow: var(--shadow-glow);
}
.btn-primary::before {
  content: ""; position: absolute; top: 0; left: -80%; width: 60%; height: 100%;
  background: linear-gradient(105deg, transparent, rgba(255,255,255,.4), transparent);
  transition: left .55s ease;
}
.btn-primary:hover::before { left: 120%; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(99, 102, 241, .45); }
.btn-primary:active { transform: translateY(0) scale(.98); }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-primary:disabled::before { display: none; }
.btn svg { width: 15px; height: 15px; }

/* ============ Status ============ */
.status-wrap { display: flex; flex-direction: column; gap: 9px; flex: 1; min-width: 200px; }
.status-badge {
  font-size: 13px; font-weight: 700; padding: 7px 15px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 8px; width: fit-content;
  transition: all .35s; letter-spacing: .2px;
}
.status-badge.idle { color: var(--text-3); background: var(--surface-2); border: 1px solid var(--border); }
.status-badge.running { color: var(--accent); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
.status-badge.done { color: var(--green); background: color-mix(in srgb, var(--green) 10%, transparent); border: 1px solid color-mix(in srgb, var(--green) 28%, transparent); }
.status-badge.error { color: var(--red); background: color-mix(in srgb, var(--red) 10%, transparent); border: 1px solid color-mix(in srgb, var(--red) 28%, transparent); }
.status-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.status-badge.running .dot { animation: pulse 1s ease infinite; box-shadow: 0 0 0 0 currentColor; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); }
  70% { box-shadow: 0 0 0 8px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.progress-bar { height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; display: none; border: 1px solid var(--border); }
.progress-bar.on { display: block; }
.progress-bar i { display: block; height: 100%; width: 42%; border-radius: 4px; background: var(--grad); animation: slide 1.15s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -42%; } 100% { margin-left: 100%; } }

/* ============ Success checkmark ============ */
.check-anim { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 36px 0; }
.check-anim svg { width: 64px; height: 64px; }
.check-anim .ck-circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2.5; animation: ck .7s cubic-bezier(.65,0,.45,1) forwards; }
.check-anim .ck-mark { stroke-dasharray: 48; stroke-dashoffset: 48; stroke-width: 3; animation: ck .4s .5s cubic-bezier(.65,0,.45,1) forwards; }
@keyframes ck { to { stroke-dashoffset: 0; } }
.check-anim .ck-text { font-size: 15px; font-weight: 700; color: var(--green); }
.check-anim .ck-sub { font-size: 12px; color: var(--text-3); }

/* ============ Result tabs ============ */
.res-tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
.res-tab {
  padding: 12px 20px; cursor: pointer; font-size: 13px; font-weight: 700;
  color: var(--text-3); transition: all .22s; background: none;
  border: none; border-bottom: 3px solid transparent; margin-bottom: -1px;
  display: flex; align-items: center; gap: 8px; font-family: inherit; position: relative;
}
.res-tab .tab-count {
  font-size: 10.5px; font-weight: 800; padding: 1px 8px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
  transition: all .22s;
}
.res-tab:hover { color: var(--text); }
.res-tab.active { color: var(--accent); }
.res-tab.active::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: -1.5px; height: 3px;
  border-radius: 3px; background: var(--grad);
}
.res-tab.active .tab-count { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.res-pane { display: none; padding-top: 6px; }
.res-pane.active { display: block; animation: fadeUp .32s ease; }

/* ============ Flomo note render ============ */
.flomo-note {
  font-size: 14px; line-height: 1.9; padding: 24px 26px;
  background: var(--surface-2); border-radius: 15px;
  border: 1px solid var(--border); position: relative; overflow: hidden;
  transition: background .35s, border-color .35s;
}
.flomo-note::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--grad); opacity: .8;
}
.flomo-note .tag-line { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.flomo-note .tag-line span {
  font-size: 11.5px; font-weight: 700; padding: 4px 13px; border-radius: 999px;
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  color: var(--accent); letter-spacing: .3px; transition: all .2s;
}
.flomo-note .tag-line span:hover { transform: translateY(-1px) scale(1.03); box-shadow: var(--shadow-sm); }
.flomo-note .bold-title {
  font-weight: 800; font-size: 16px; margin-bottom: 8px; letter-spacing: -.2px;
  background: var(--grad-text); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.flomo-note .source { color: var(--text-3); font-size: 12px; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
.flomo-note .concept {
  margin-bottom: 12px; padding: 14px 16px; background: var(--surface-solid);
  border-radius: 12px; border: 1px solid var(--border); border-left: 3px solid var(--accent);
}
.flomo-note .subconcept { margin-bottom: 6px; padding-left: 4px; color: var(--text-2); }
.flomo-note .subconcept::before {
  content: "◆"; color: var(--accent-2); font-size: 8px; margin-right: 10px; vertical-align: 2px;
}
.flomo-note mark {
  background: linear-gradient(180deg, transparent 55%, var(--mark-bg) 55%);
  color: var(--mark-text); padding: 0 3px; font-weight: 600; border-radius: 2px;
}
body.dark .flomo-note mark { background: linear-gradient(180deg, transparent 55%, var(--mark-bg) 55%); }
.flomo-note strong { font-weight: 800; }
.note-meta {
  margin-top: 16px; padding: 12px 16px; background: var(--accent-soft);
  border-radius: 12px; font-size: 12.5px; color: var(--accent); font-weight: 700;
  display: flex; align-items: center; gap: 9px; border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
}

/* ============ Compare ============ */
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.compare-col { display: flex; flex-direction: column; }
.compare-label {
  font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px; color: var(--text-3);
}
.compare-label .lb-badge {
  font-size: 10px; padding: 2px 9px; border-radius: 999px; letter-spacing: .3px;
}
.compare-label.new .lb-badge { background: var(--accent-soft); color: var(--accent); }
.compare-label.old .lb-badge { background: color-mix(in srgb, var(--orange) 12%, transparent); color: var(--orange); }
.compare-panel {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px; max-height: 470px; overflow-y: auto; font-size: 13px; line-height: 1.8;
  transition: background .35s, box-shadow .25s; flex: 1;
}
.compare-panel:hover { box-shadow: var(--shadow-sm); }
.compare-panel mark { background: var(--mark-bg); color: var(--mark-text); padding: 0 3px; border-radius: 3px; font-weight: 600; }
.decision-bar {
  padding: 14px 17px; border-radius: 14px; margin-bottom: 18px;
  display: flex; align-items: center; gap: 12px; font-size: 13.5px; font-weight: 700;
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  animation: fadeUp .35s ease;
}
.decision-bar.force-new { background: color-mix(in srgb, var(--blue) 9%, transparent); border-color: color-mix(in srgb, var(--blue) 30%, transparent); }
.decision-bar.update { background: color-mix(in srgb, var(--orange) 9%, transparent); border-color: color-mix(in srgb, var(--orange) 30%, transparent); }
.decision-bar.skip { background: var(--surface-2); border-color: var(--border); }
.decision-icon {
  width: 36px; height: 36px; border-radius: 11px; display: flex;
  align-items: center; justify-content: center; font-size: 17px;
  background: var(--surface-solid); box-shadow: var(--shadow-sm); flex-shrink: 0;
}
.relevance-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.relevance-ring { width: 44px; height: 44px; position: relative; flex-shrink: 0; }
.relevance-ring svg { width: 44px; height: 44px; transform: rotate(-90deg); }
.relevance-ring .ring-bg { stroke: var(--border); stroke-width: 4.5; fill: none; }
.relevance-ring .ring-fg { stroke: var(--accent); stroke-width: 4.5; fill: none; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.relevance-ring .ring-txt {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
}
.relevance-ring.high .ring-fg { stroke: var(--red); }
.relevance-ring.high .ring-txt { color: var(--red); }
.relevance-ring.low .ring-fg { stroke: var(--green); }
.relevance-ring.low .ring-txt { color: var(--green); }
.relevance-txt { font-size: 13px; color: var(--text-2); font-weight: 600; }

/* ============ Raw log ============ */
.raw-log-wrap { position: relative; }
.raw-log {
  background: var(--code-bg); color: var(--code-text); padding: 20px 22px;
  border-radius: 15px; font-family: "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, monospace;
  font-size: 12px; line-height: 1.75; white-space: pre-wrap; word-break: break-all;
  overflow-x: auto; max-height: 540px; overflow-y: auto;
  box-shadow: inset 0 2px 8px rgba(0,0,0,.35), var(--shadow-sm);
  border: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
}
.raw-log::-webkit-scrollbar { width: 9px; }
.raw-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 5px; }
.raw-log::-webkit-scrollbar-track { background: transparent; }
.raw-log .log-ok { color: #34d399; }
.raw-log .log-err { color: #fb7185; }

/* ============ Animations ============ */
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeUp .4s cubic-bezier(.16,1,.3,1); }
.stagger > * { animation: fadeUp .45s cubic-bezier(.16,1,.3,1) both; }
.stagger > *:nth-child(1) { animation-delay: .02s; }
.stagger > *:nth-child(2) { animation-delay: .08s; }
.stagger > *:nth-child(3) { animation-delay: .14s; }

/* ============ Responsive ============ */
@media (max-width: 680px) {
  .container { padding: 18px 12px 50px; }
  .card { padding: 19px; }
  .compare-grid { grid-template-columns: 1fr; }
  .header { padding: 12px 16px; }
  .tab-btn { font-size: 12px; padding: 9px 6px; gap: 5px; }
  .btn-row { flex-direction: column; align-items: stretch; }
  .btn-primary { justify-content: center; }
  .hint-chips { gap: 6px; }
  .card-title .title-sub { display: none; }
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>
        <path d="M19 3v4M21 5h-4"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>mynews</h1>
      <small>AI 知识笔记处理器</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换夜色模式">
      <svg id="themeIcoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg id="themeIcoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</div>

<div class="container stagger">

<div class="card">
  <div class="card-title">
    <span class="title-icon">📥</span> 输入内容
    <span class="title-sub">正文 / URL / 图片 均可</span>
  </div>
  <div class="input-tabs">
    <button class="tab-btn active" onclick="switchTab('text')"><span class="tab-ico">📝</span> 正文</button>
    <button class="tab-btn" onclick="switchTab('url')"><span class="tab-ico">🔗</span> URL</button>
    <button class="tab-btn" onclick="switchTab('image')"><span class="tab-ico">🖼️</span> 图片</button>
  </div>
  <div id="tab-text" class="tab-pane active">
    <div class="field">
      <textarea id="content" placeholder="粘贴文章正文或笔记内容…"></textarea>
      <span class="char-count" id="charCount">0 字符</span>
    </div>
    <div class="hint-chips">
      <span class="hint-chip allow">✓ 加粗 **</span>
      <span class="hint-chip allow">✓ 高亮 &lt;mark&gt;</span>
      <span class="hint-chip allow">✓ 列表 -</span>
      <span class="hint-chip deny">✕ 链接 / 图片</span>
      <span class="hint-chip deny">✕ 表格 / 引用</span>
    </div>
  </div>
  <div id="tab-url" class="tab-pane">
    <div class="field">
      <input type="text" id="url" placeholder="https://example.com/article">
    </div>
    <div class="hint-chips">
      <span class="hint-chip">🔎 自动抓取正文后交给 AI 分析</span>
    </div>
  </div>
  <div id="tab-image" class="tab-pane">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="dz-ico">🖼️</span>
      <div class="dz-main">点击上传或拖拽图片到此处</div>
      <div class="dz-sub">支持 JPG / PNG / WebP，AI 自动提取文字</div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="previewImage(event)">
    </div>
    <div id="imagePreview" style="display:none;margin-top:15px;position:relative">
      <img id="previewImg" style="max-width:100%;max-height:300px;border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow-md)">
      <button class="btn" style="position:absolute;top:10px;right:10px;padding:7px 13px;background:rgba(15,17,30,.7);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;backdrop-filter:blur(8px)" onclick="clearImage()">✕ 移除</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="submitBtn" onclick="process()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
      处理并上传
    </button>
    <div class="status-wrap">
      <span class="status-badge idle" id="status"><span class="dot"></span> 就绪</span>
      <div class="progress-bar" id="progressBar"><i></i></div>
    </div>
  </div>
</div>

<div id="result-section" style="display:none">
  <div class="card">
    <div class="res-tabs">
      <button class="res-tab active" onclick="switchRes('note')"><span>📄</span> 笔记 <span class="tab-count" id="cntNote">0</span></button>
      <button class="res-tab" onclick="switchRes('compare')"><span>🔍</span> 对比 <span class="tab-count" id="cntCompare">0</span></button>
      <button class="res-tab" onclick="switchRes('log')"><span>📋</span> 日志</button>
    </div>
    <div id="res-note" class="res-pane active"></div>
    <div id="res-compare" class="res-pane"></div>
    <div id="res-log" class="res-pane"></div>
  </div>
</div>

</div>

<script>
function toggleTheme() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('themeIcoMoon').style.display = isDark ? 'none' : 'block';
  document.getElementById('themeIcoSun').style.display = isDark ? 'block' : 'none';
  localStorage.setItem('mynews-theme', isDark ? 'dark' : 'light');
}
(function() {
  if (localStorage.getItem('mynews-theme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeIcoMoon').style.display = 'none';
    document.getElementById('themeIcoSun').style.display = 'block';
  }
})();

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick*="'${tab}'"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}
function switchRes(tab) {
  document.querySelectorAll('.res-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.res-pane').forEach(t => t.classList.remove('active'));
  document.querySelector(`.res-tab[onclick*="'${tab}'"]`).classList.add('active');
  document.getElementById(`res-${tab}`).classList.add('active');
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderFlomoNote(text) {
  let html = '<div class="flomo-note">';
  for (const line of text.split('\n')) {
    if (line.startsWith('#')) {
      const tags = line.split(/\s+/).filter(Boolean).map(t => `<span>${escapeHtml(t)}</span>`).join('');
      html += `<div class="tag-line">${tags}</div>`;
    } else if (/^\*\*.*\*\*$/.test(line.trim()) && !line.includes('**来源**') && !line.includes('**概念**') ) {
      html += `<div class="bold-title">${escapeHtml(line).replace(/\*\*/g, '')}</div>`;
    } else if (line.startsWith('**来源**')) {
      html += `<div class="source">${escapeHtml(line)}</div>`;
    } else if (line.startsWith('**概念**')) {
      html += `<div class="concept">${line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/<mark>(.*?)<\/mark>/g, '<mark>$1</mark>')}</div>`;
    } else if (line.startsWith('- ')) {
      html += `<div class="subconcept">${line.slice(2).replace(/<mark>(.*?)<\/mark>/g, '<mark>$1</mark>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>`;
    } else if (line.trim() === '') {
      html += '<div style="height:8px"></div>';
    } else {
      html += `<div>${escapeHtml(line)}</div>`;
    }
  }
  html += '</div>';
  return html;
}

function parseMarkers(text) {
  const sections = {};
  const m1 = text.match(/==BEGIN_FLOMO_NOTE==\n([\s\S]*?)==END_FLOMO_NOTE==/);
  if (m1) sections.flomoNote = m1[1].trim();
  const m2 = text.match(/==BEGIN_OLD_MARKDOWN==\n([\s\S]*?)==END_OLD_MARKDOWN==/);
  if (m2) sections.oldNote = m2[1].trim();
  const m3 = text.match(/==BEGIN_NEW_MARKDOWN==\n([\s\S]*?)==END_NEW_MARKDOWN==/);
  if (m3) sections.newNote = m3[1].trim();
  const m4 = text.match(/旧笔记 id=([a-zA-Z0-9_]+)/);
  if (m4) sections.oldId = m4[1];
  const m5 = text.match(/上传成功 id=([a-zA-Z0-9_]+)/);
  if (m5) sections.newId = m5[1];
  const m6 = text.match(/relevance=([\d.]+)/);
  if (m6) sections.relevance = parseFloat(m6[1]);
  const m7 = text.match(/\[auto\] AI 决定：(.+?)(?:\n|$)/);
  if (m7) sections.aiDecision = m7[1].trim();
  return sections;
}

function checkSuccessAnim() {
  return `<div class="check-anim">
    <svg viewBox="0 0 64 64" fill="none">
      <circle class="ck-circle" cx="32" cy="32" r="26.5" stroke="var(--green)"/>
      <path class="ck-mark" d="M20 33l8.5 8.5L44 24" stroke="var(--green)" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="ck-text">处理完成</div>
    <div class="ck-sub">笔记已同步至 flomo</div>
  </div>`;
}

function renderResults(data) {
  const sections = parseMarkers(data.output || '');
  const log = data.output || '';

  // Note tab
  const noteDiv = document.getElementById('res-note');
  if (sections.flomoNote) {
    noteDiv.innerHTML = renderFlomoNote(sections.flomoNote);
    if (sections.newId) noteDiv.innerHTML += `<div class="note-meta">✅ 已上传 · flomo ID: ${escapeHtml(sections.newId)}</div>`;
  } else if (data.success) {
    const skipped = (data.output || '').includes('无增量 → 跳过') || (data.output || '').includes('已跳过');
    if (skipped) {
      noteDiv.innerHTML = `<div style="color:var(--orange);font-size:14px;text-align:center;padding:36px 0;font-weight:600">⏭️ 已跳过（与已有笔记重复，无增量）</div>`;
    } else {
      noteDiv.innerHTML = checkSuccessAnim() + '<div style="text-align:center;font-size:12px;color:var(--text-3);margin-top:-16px">笔记内容未捕获，请查看日志</div>';
    }
  } else {
    noteDiv.innerHTML = `<div style="color:var(--red);font-size:14px;text-align:center;padding:36px 0;font-weight:600">❌ 处理未完成，请查看日志</div>`;
  }

  // Compare tab
  const compDiv = document.getElementById('res-compare');
  if (sections.oldNote) {
    let html = '';
    if (sections.relevance !== undefined) {
      const pct = Math.round(sections.relevance * 100);
      const C = 2 * Math.PI * 19.75;
      const off = C * (1 - sections.relevance);
      const cls = sections.relevance >= 0.9 ? 'high' : 'low';
      html += `<div class="relevance-wrap">
        <div class="relevance-ring ${cls}">
          <svg viewBox="0 0 44 44">
            <circle class="ring-bg" cx="22" cy="22" r="19.75"/>
            <circle class="ring-fg" cx="22" cy="22" r="19.75" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
          </svg>
          <span class="ring-txt">${pct}%</span>
        </div>
        <span class="relevance-txt">与已有笔记的相似度</span>
      </div>`;
    }
    if (sections.aiDecision) {
      const isForceNew = sections.aiDecision.includes('强制新建');
      const isUpdate = sections.aiDecision.includes('更新');
      const isSkip = sections.aiDecision.includes('跳过');
      let cls = 'skip', icon = '⏭️';
      if (isForceNew) { cls = 'force-new'; icon = '🆕'; }
      else if (isUpdate) { cls = 'update'; icon = '📝'; }
      html += `<div class="decision-bar ${cls}"><span class="decision-icon">${icon}</span> ${escapeHtml(sections.aiDecision)}</div>`;
    }
    html += '<div class="compare-grid">' +
      '<div class="compare-col"><div class="compare-label new"><span class="lb-badge">NEW</span> 新内容</div><div class="compare-panel">' + renderFlomoNote(sections.newNote || '(无)') + '</div></div>' +
      '<div class="compare-col"><div class="compare-label old"><span class="lb-badge">OLD</span> 已有笔记</div><div class="compare-panel">' + renderFlomoNote(sections.oldNote) + '</div></div>' +
      '</div>';
    compDiv.innerHTML = html;
  } else {
    compDiv.innerHTML = '<div style="color:var(--text-3);font-size:14px;text-align:center;padding:28px 0">未检测到相似笔记，已直接上传</div>';
  }

  // Log tab
  document.getElementById('res-log').innerHTML = `<div class="raw-log-wrap"><div class="raw-log">${escapeHtml(log)}</div></div>`;

  // Counts
  document.getElementById('cntNote').textContent = sections.flomoNote ? '1' : '0';
  document.getElementById('cntCompare').textContent = sections.oldNote ? '1' : '0';

  document.getElementById('result-section').style.display = 'block';
  document.getElementById('result-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

let uploadedFile = null;

function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  uploadedFile = file;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('previewImg').src = ev.target.result;
    document.getElementById('imagePreview').style.display = 'block';
    document.getElementById('dropZone').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  uploadedFile = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('dropZone').style.display = 'block';
}

// Drag & drop support
const dropZone = document.getElementById('dropZone');
if (dropZone) {
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      document.getElementById('fileInput').files = e.dataTransfer.files;
      previewImage({ target: { files: [file] } });
    }
  });
}

// Char counter
const contentEl = document.getElementById('content');
if (contentEl) {
  contentEl.addEventListener('input', () => {
    document.getElementById('charCount').textContent = contentEl.value.length + ' 字符';
  });
}

async function process() {
  const content = document.getElementById('content').value.trim();
  const url = document.getElementById('url').value.trim();
  const hasImage = !!uploadedFile;

  if (!content && !url && !hasImage) {
    setStatus('请填写内容或上传图片', 'error');
    return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerHTML = '处理中…';
  setStatus('AI 分析中…', 'running');
  document.getElementById('progressBar').classList.add('on');
  document.getElementById('result-section').style.display = 'none';

  let body;
  const headers = {};
  if (hasImage) {
    const fd = new FormData();
    fd.append('image', uploadedFile);
    body = fd;
  } else {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify({ content, url });
  }

  try {
    const resp = await fetch('/process', {
      method: 'POST',
      headers: headers,
      body: body
    });
    const data = await resp.json();
    renderResults(data);
    setStatus(data.success ? (data.output.includes('跳过') ? '已跳过（重复）' : '处理完成') : '处理失败',
              data.success ? 'done' : 'error');
  } catch (e) {
    document.getElementById('res-log').innerHTML = `<div class="raw-log-wrap"><div class="raw-log">请求失败: ${escapeHtml(e.message)}</div></div>`;
    document.getElementById('result-section').style.display = 'block';
    setStatus('网络错误', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg> 处理并上传';
    document.getElementById('progressBar').classList.remove('on');
  }
}

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.innerHTML = `<span class="dot"></span> ${text}`;
  el.className = `status-badge ${cls}`;
}
</script>
</body>
</html>
