<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mynews — 知识笔记处理器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root {
  --bg: #f0f2f5; --surface: #ffffff; --text: #1a1a2e; --text2: #6b7280;
  --border: #e5e7eb; --accent: #4f6ef7; --accent-hover: #3b5de7; --accent-light: #eef1ff;
  --green: #10b981; --red: #ef4444; --orange: #f59e0b; --blue: #3b82f6;
  --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.08);
  --input-bg: #fff; --panel-bg: #f8f9fb; --code-bg: #1a1b2e; --code-text: #e4e4ef;
  --tag-color: #4f6ef7; --mark-bg: #fef3c7; --mark-text: #92400e;
}
body.dark {
  --bg: #0f0f23; --surface: #1a1b3a; --text: #e4e4ef; --text2: #9495b5;
  --border: #2a2b4a; --accent: #6b8aff; --accent-hover: #5a7aee; --accent-light: #1e2040;
  --shadow: 0 1px 3px rgba(0,0,0,.2); --shadow-lg: 0 4px 24px rgba(0,0,0,.3);
  --input-bg: #222345; --panel-bg: #1e1f40; --code-bg: #0b0b1a;
  --tag-color: #8ba4ff; --mark-bg: #3d2e00; --mark-text: #fbbf24;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); padding: 0; min-height: 100vh;
  transition: background .3s, color .3s;
}
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 16px 24px; display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px);
  transition: background .3s;
}
.header h1 { font-size: 18px; font-weight: 700; margin: 0; flex: 1; }
.header h1 span { color: var(--accent); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.theme-btn {
  background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; cursor: pointer; font-size: 16px; transition: all .2s;
  color: var(--text); line-height: 1;
}
.theme-btn:hover { background: var(--accent-light); border-color: var(--accent); }
.container { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
.card {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 24px; margin-bottom: 20px;
  box-shadow: var(--shadow); transition: background .3s, box-shadow .3s;
}
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.input-grid { display: grid; gap: 16px; }
.input-tabs { display: flex; gap: 0; background: var(--panel-bg); border-radius: 8px; padding: 3px; }
.tab-btn {
  flex: 1; padding: 8px 16px; border: none; background: transparent; border-radius: 6px;
  cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); transition: all .2s;
}
.tab-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.tab-pane { display: none; padding-top: 12px; }
.tab-pane.active { display: block; }
textarea, input[type="text"] {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: inherit; background: var(--input-bg); color: var(--text);
  transition: border .2s, background .3s; outline: none; resize: vertical;
}
textarea { min-height: 140px; }
textarea:focus, input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.options { display: flex; gap: 16px; flex-wrap: wrap; padding: 4px 0; }
.option-label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; color: var(--text2); }
.option-label input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.btn-row { display: flex; gap: 12px; align-items: center; margin-top: 4px; }
.btn {
  padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,110,247,.3); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.status-badge { font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 20px; }
.status-badge.idle { color: var(--text2); }
.status-badge.running { color: var(--accent); background: var(--accent-light); }
.status-badge.done { color: var(--green); background: #ecfdf5; }
body.dark .status-badge.done { background: #064e3b; }
.status-badge.error { color: var(--red); background: #fef2f2; }
body.dark .status-badge.error { background: #450a0a; }

/* Results tabs */
.res-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 0; }
.res-tab {
  padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -2px; color: var(--text2);
  transition: all .2s; background: none; border-top: none; border-left: none; border-right: none;
}
.res-tab:hover { color: var(--text); }
.res-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.res-pane { display: none; padding-top: 20px; }
.res-pane.active { display: block; }

/* Flomo note render */
.flomo-note { font-size: 14px; line-height: 1.8; padding: 20px; background: var(--panel-bg); border-radius: var(--radius); border: 1px solid var(--border); transition: background .3s; }
.flomo-note .tag-line { color: var(--tag-color); font-size: 12px; font-weight: 500; letter-spacing: .3px; margin-bottom: 8px; }
.flomo-note .bold-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.flomo-note .source { color: var(--text2); font-size: 12px; margin-bottom: 14px; }
.flomo-note .concept { margin-bottom: 10px; }
.flomo-note .subconcept { margin-bottom: 4px; padding-left: 0; }
.flomo-note mark { background: var(--mark-bg); color: var(--mark-text); padding: 1px 4px; border-radius: 3px; font-weight: 500; }
.flomo-note strong { font-weight: 700; }

/* Compare */
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.compare-panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; max-height: 480px; overflow-y: auto; font-size: 13px; line-height: 1.7; transition: background .3s; }
.compare-panel mark { background: var(--mark-bg); color: var(--mark-text); padding: 1px 4px; border-radius: 3px; }
.compare-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.compare-label.new { color: var(--accent); }
.compare-label.old { color: var(--orange); }
.decision-bar {
  padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500;
  background: var(--accent-light); border-left: 3px solid var(--accent);
}
.decision-bar.force-new { background: #eff6ff; border-left-color: var(--blue); }
body.dark .decision-bar.force-new { background: #1e3a5f; border-left-color: var(--blue); }
.decision-bar.update { background: #fff7ed; border-left-color: var(--orange); }
body.dark .decision-bar.update { background: #3d2e00; border-left-color: var(--orange); }
.decision-bar.skip { background: #f3f4f6; border-left-color: var(--text2); }
body.dark .decision-bar.skip { background: #1f2937; border-left-color: var(--text2); }
.decision-icon { font-size: 20px; }
.relevance-badge {
  display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
}
.relevance-high { background: #fef2f2; color: var(--red); }
body.dark .relevance-high { background: #450a0a; }
.relevance-low { background: #f3f4f6; color: var(--text2); }
body.dark .relevance-low { background: #1f2937; }

/* Raw log */
.raw-log { background: var(--code-bg); color: var(--code-text); padding: 16px; border-radius: var(--radius); font-family: "Cascadia Code", "SF Mono", "Fira Code", monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; overflow-x: auto; max-height: 520px; overflow-y: auto; }

/* Animation */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn .3s ease; }

/* Responsive */
@media (max-width: 640px) {
  .container { padding: 16px 12px; }
  .card { padding: 16px; }
  .compare-grid { grid-template-columns: 1fr; }
  .header { padding: 12px 16px; }
}
</style>
</head>
<body>

<div class="header">
  <h1><span>mynews</span> — 知识笔记</h1>
  <div class="header-actions">
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="切换夜色模式">🌙</button>
  </div>
</div>

<div class="container">

<div class="card fade-in">
  <div class="card-title">📥 输入内容</div>
  <div class="input-tabs">
    <button class="tab-btn active" onclick="switchTab('text')">📝 正文</button>
    <button class="tab-btn" onclick="switchTab('url')">🔗 URL</button>
    <button class="tab-btn" onclick="switchTab('image')">🖼️ 图片</button>
  </div>
  <div id="tab-text" class="tab-pane active">
    <textarea id="content" placeholder="粘贴文章正文或笔记内容…"></textarea>
  </div>
  <div id="tab-url" class="tab-pane">
    <input type="text" id="url" class="url-input" placeholder="https://example.com/article">
  </div>
  <div id="tab-image" class="tab-pane">
    <div style="border:2px dashed var(--border);border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all .2s" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div style="font-size:40px;margin-bottom:8px">📷</div>
      <div style="font-size:14px;color:var(--text2)">点击上传或拖拽图片到此处</div>
      <div style="font-size:12px;color:var(--text2);margin-top:4px">支持 JPG / PNG / WebP，AI 自动提取文字</div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="previewImage(event)">
    </div>
    <div id="imagePreview" style="display:none;margin-top:12px;position:relative">
      <img id="previewImg" style="max-width:100%;max-height:300px;border-radius:8px;border:1px solid var(--border)">
      <button class="btn" style="position:absolute;top:8px;right:8px;padding:4px 10px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px" onclick="clearImage()">✕ 移除</button>
    </div>
  </div>
  <div class="options" style="margin-top:12px">
    <label class="option-label"><input type="checkbox" id="forceNew"> 强制新建 (--force-new)</label>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="submitBtn" onclick="process()">✨ 处理并上传</button>
    <span class="status-badge idle" id="status">就绪</span>
  </div>
</div>

<div id="result-section" style="display:none">
  <div class="card fade-in">
    <div class="res-tabs">
      <button class="res-tab active" onclick="switchRes('note')">📄 笔记</button>
      <button class="res-tab" onclick="switchRes('compare')">🔍 对比</button>
      <button class="res-tab" onclick="switchRes('log')">📋 日志</button>
    </div>
    <div id="res-note" class="res-pane active"></div>
    <div id="res-compare" class="res-pane"></div>
    <div id="res-log" class="res-pane"></div>
  </div>
</div>

</div>

<script>
function toggleTheme() {
  document.body.classList.toggle('dark');
  const btn = document.getElementById('themeBtn');
  btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  localStorage.setItem('mynews-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}
(function() {
  if (localStorage.getItem('mynews-theme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeBtn').textContent = '☀️';
  }
})();

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick*="'${tab}'"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}
function switchRes(tab) {
  document.querySelectorAll('.res-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.res-pane').forEach(t => t.classList.remove('active'));
  document.querySelector(`.res-tab[onclick*="'${tab}'"]`).classList.add('active');
  document.getElementById(`res-${tab}`).classList.add('active');
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderFlomoNote(text) {
  let html = '<div class="flomo-note">';
  for (const line of text.split('\n')) {
    if (line.startsWith('#')) {
      html += `<div class="tag-line">${escapeHtml(line)}</div>`;
    } else if (/^\*\*.*\*\*$/.test(line.trim()) && !line.includes('**来源**') && !line.includes('**概念**') ) {
      html += `<div class="bold-title">${escapeHtml(line)}</div>`;
    } else if (line.startsWith('**来源**')) {
      html += `<div class="source">${escapeHtml(line)}</div>`;
    } else if (line.startsWith('**概念**')) {
      html += `<div class="concept">${line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/<mark>(.*?)<\/mark>/g, '<mark>$1</mark>')}</div>`;
    } else if (line.startsWith('- ')) {
      html += `<div class="subconcept">${line.replace(/<mark>(.*?)<\/mark>/g, '<mark>$1</mark>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>`;
    } else if (line.trim() === '') {
      html += '<div style="height:6px"></div>';
    } else {
      html += `<div>${escapeHtml(line)}</div>`;
    }
  }
  html += '</div>';
  return html;
}

function parseMarkers(text) {
  const sections = {};
  const m1 = text.match(/==BEGIN_FLOMO_NOTE==\n([\s\S]*?)==END_FLOMO_NOTE==/);
  if (m1) sections.flomoNote = m1[1].trim();
  const m2 = text.match(/==BEGIN_OLD_MARKDOWN==\n([\s\S]*?)==END_OLD_MARKDOWN==/);
  if (m2) sections.oldNote = m2[1].trim();
  const m3 = text.match(/==BEGIN_NEW_MARKDOWN==\n([\s\S]*?)==END_NEW_MARKDOWN==/);
  if (m3) sections.newNote = m3[1].trim();
  const m4 = text.match(/旧笔记 id=([a-zA-Z0-9_]+)/);
  if (m4) sections.oldId = m4[1];
  const m5 = text.match(/上传成功 id=([a-zA-Z0-9_]+)/);
  if (m5) sections.newId = m5[1];
  const m6 = text.match(/relevance=([\d.]+)/);
  if (m6) sections.relevance = parseFloat(m6[1]);
  const m7 = text.match(/\[auto\] AI 决定：(.+?)(?:\n|$)/);
  if (m7) sections.aiDecision = m7[1].trim();
  return sections;
}

function renderResults(data) {
  const sections = parseMarkers(data.output || '');
  const log = data.output || '';

  // Note tab
  const noteDiv = document.getElementById('res-note');
  if (sections.flomoNote) {
    noteDiv.innerHTML = renderFlomoNote(sections.flomoNote);
    if (sections.newId) noteDiv.innerHTML += `<div style="margin-top:12px;padding:8px 12px;background:var(--accent-light);border-radius:8px;font-size:12px;color:var(--accent)">✅ 已上传 · flomo ID: ${sections.newId}</div>`;
  } else if (data.success) {
    noteDiv.innerHTML = '<div style="color:var(--text2);font-size:14px;text-align:center;padding:32px 0">已上传成功，笔记内容未捕获</div>';
  } else {
    noteDiv.innerHTML = '<div style="color:var(--red);font-size:14px;text-align:center;padding:32px 0">❌ 处理未完成</div>';
  }

  // Compare tab
  const compDiv = document.getElementById('res-compare');
  if (sections.oldNote) {
    let html = '';
    if (sections.relevance !== undefined) {
      const pct = Math.round(sections.relevance * 100);
      const cls = sections.relevance >= 0.9 ? 'relevance-high' : 'relevance-low';
      html += `<div style="margin-bottom:14px;font-size:13px">相似度 <span class="relevance-badge ${cls}">${pct}%</span></div>`;
    }
    if (sections.aiDecision) {
      const isForceNew = sections.aiDecision.includes('强制新建');
      const isUpdate = sections.aiDecision.includes('更新');
      const isSkip = sections.aiDecision.includes('跳过');
      let cls = 'skip', icon = '⏭️';
      if (isForceNew) { cls = 'force-new'; icon = '🆕'; }
      else if (isUpdate) { cls = 'update'; icon = '📝'; }
      html += `<div class="decision-bar ${cls}"><span class="decision-icon">${icon}</span> ${escapeHtml(sections.aiDecision)}</div>`;
    }
    html += '<div class="compare-grid">' +
      '<div><div class="compare-label new">新内容</div><div class="compare-panel">' + renderFlomoNote(sections.newNote || '(无)') + '</div></div>' +
      '<div><div class="compare-label old">已有笔记</div><div class="compare-panel">' + renderFlomoNote(sections.oldNote) + '</div></div>' +
      '</div>';
    compDiv.innerHTML = html;
  } else {
    compDiv.innerHTML = '<div style="color:var(--text2);font-size:14px;text-align:center;padding:24px 0">未检测到相似笔记，已直接上传</div>';
  }

  // Log tab
  document.getElementById('res-log').innerHTML = `<div class="raw-log">${escapeHtml(log)}</div>`;
  document.getElementById('result-section').style.display = 'block';
}

let uploadedFile = null;

function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  uploadedFile = file;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('previewImg').src = ev.target.result;
    document.getElementById('imagePreview').style.display = 'block';
    document.getElementById('dropZone').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  uploadedFile = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('dropZone').style.display = 'block';
}

// Drag & drop support
const dropZone = document.getElementById('dropZone');
if (dropZone) {
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; });
  dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.style.borderColor = '';
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      document.getElementById('fileInput').files = e.dataTransfer.files;
      previewImage({ target: { files: [file] } });
    }
  });
}

async function process() {
  const content = document.getElementById('content').value.trim();
  const url = document.getElementById('url').value.trim();
  const forceNew = document.getElementById('forceNew').checked;
  const hasImage = !!uploadedFile;

  if (!content && !url && !hasImage) {
    document.getElementById('status').textContent = '⚠️ 请填写内容或上传图片';
    document.getElementById('status').className = 'status-badge error';
    return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '⏳ 处理中…';
  const status = document.getElementById('status');
  status.textContent = 'AI 分析中…'; status.className = 'status-badge running';
  document.getElementById('result-section').style.display = 'none';

  let body;
  const headers = {};
  if (hasImage) {
    const fd = new FormData();
    fd.append('image', uploadedFile);
    if (forceNew) fd.append('forceNew', '1');
    body = fd;
  } else {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify({ content, url, forceNew });
  }

  try {
    const resp = await fetch('/process', {
      method: 'POST',
      headers: headers,
      body: body
    });
    const data = await resp.json();
    renderResults(data);
    status.textContent = data.success ? (data.output.includes('跳过') ? '⏭️ 已跳过（重复）' : '✅ 处理完成') : '❌ 处理失败';
    status.className = data.success ? 'status-badge done' : 'status-badge error';
  } catch (e) {
    document.getElementById('res-log').innerHTML = `<div class="raw-log">请求失败: ${escapeHtml(e.message)}</div>`;
    document.getElementById('result-section').style.display = 'block';
    status.textContent = '❌ 网络错误'; status.className = 'status-badge error';
  } finally {
    btn.disabled = false; btn.textContent = '✨ 处理并上传';
  }
}
</script>
</body>
</html>
