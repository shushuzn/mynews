<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mynews — 知识笔记处理器</title>
<style>
/* ============ Apple Design Language ============ */
:root {
  --bg: #f2f2f7;
  --bg-grad: radial-gradient(1200px 500px at 80% -10%, rgba(10, 132, 255, .08), transparent 60%),
             radial-gradient(900px 420px at 0% 110%, rgba(175, 82, 222, .06), transparent 55%);
  --surface: #ffffff;
  --surface-2: #f2f2f7;
  --surface-3: #e5e5ea;
  --text: #1c1c1e;
  --text-2: #48484a;
  --text-3: #8e8e93;
  --separator: #d1d1d6;
  --separator-light: #e5e5ea;
  --blue: #007aff;
  --blue-dark: #0a84ff;
  --purple: #af52de;
  --pink: #ff2d55;
  --orange: #ff9500;
  --green: #34c759;
  --red: #ff3b30;
  --yellow: #ffcc00;
  --teal: #30b0c7;
  --indigo: #5856d6;
  --grad-btn: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 100%);
  --grad-title: linear-gradient(120deg, #007aff 0%, #5856d6 60%, #af52de 100%);
  --mark-bg: #ffe8a3;
  --mark-text: #6b4a00;
  --code-bg: #1c1c1e;
  --code-text: #d1d1d6;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, .08), 0 2px 4px rgba(0, 0, 0, .05);
  --shadow-lg: 0 18px 40px rgba(0, 0, 0, .12), 0 6px 16px rgba(0, 0, 0, .08);
  --ease: cubic-bezier(.25, .1, .25, 1);
  --tag-colors: var(--blue), var(--purple), var(--pink), var(--orange), var(--teal), var(--green), var(--indigo);
}
body.dark {
  --bg: #0d0d12;
  --bg-grad: radial-gradient(1200px 500px at 80% -10%, rgba(10, 132, 255, .12), transparent 60%),
             radial-gradient(900px 420px at 0% 110%, rgba(175, 82, 222, .10), transparent 55%);
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --surface-3: #3a3a3c;
  --text: #ffffff;
  --text-2: #d1d1d6;
  --text-3: #8e8e93;
  --separator: #3a3a3c;
  --separator-light: #2c2c2e;
  --blue: #0a84ff;
  --purple: #bf5af2;
  --pink: #ff375f;
  --orange: #ff9f0a;
  --green: #30d158;
  --red: #ff453a;
  --yellow: #ffd60a;
  --teal: #40c8e0;
  --indigo: #5e5ce6;
  --grad-btn: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 100%);
  --grad-title: linear-gradient(120deg, #0a84ff 0%, #5e5ce6 60%, #bf5af2 100%);
  --mark-bg: #5a4700;
  --mark-text: #ffd60a;
  --code-bg: #0a0a0c;
  --code-text: #a1a1a6;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, .4);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, .5), 0 2px 4px rgba(0, 0, 0, .4);
  --shadow-lg: 0 18px 40px rgba(0, 0, 0, .6), 0 6px 16px rgba(0, 0, 0, .45);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Segoe UI", Roboto, sans-serif;
  font-size: 14px; line-height: 1.6; color: var(--text);
  background: var(--bg-grad), var(--bg);
  background-attachment: fixed;
  transition: background .35s, color .35s; -webkit-font-smoothing: antialiased;
  letter-spacing: -.01em;
}

/* ============ Header（毛玻璃）============ */
.header {
  position: sticky; top: 0; z-index: 100;
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--separator-light);
  padding: 0 28px; height: 56px; display: flex; align-items: center; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 12px; flex: 1; }
.brand-logo {
  width: 30px; height: 30px; border-radius: 9px; background: var(--grad-btn);
  display: flex; align-items: center; justify-content: center; color: #fff;
  box-shadow: 0 2px 10px rgba(10, 132, 255, .35); flex-shrink: 0;
}
.brand-logo svg { width: 15px; height: 15px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text h1 { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
.brand-text small { font-size: 11px; color: var(--text-3); font-weight: 500; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: color-mix(in srgb, var(--surface-2) 85%, transparent);
  color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .2s var(--ease);
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); transform: scale(1.06); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 16px; height: 16px; }

/* ============ Page title ============ */
.page-head { padding: 28px 4px 20px; }
.page-head h2 { font-size: 28px; font-weight: 800; letter-spacing: -.03em; background: var(--grad-title); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.page-head p { font-size: 13px; color: var(--text-3); margin-top: 4px; }

/* ============ Layout ============ */
.container { max-width: 760px; margin: 0 auto; padding: 0 20px 80px; }
.card {
  background: var(--surface); border-radius: var(--radius-lg);
  border: 1px solid var(--separator-light); padding: 22px; margin-bottom: 20px;
  box-shadow: var(--shadow-md); position: relative;
  transition: background .35s, border-color .35s, box-shadow .25s var(--ease);
}
.card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 1px; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
  pointer-events: none;
}
body.dark .card::before { background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); }
.card-title {
  font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: .02em;
  margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}
.card-title .t-dot { width: 8px; height: 8px; border-radius: 3px; background: var(--grad-btn); }

/* ============ Segmented control（iOS）============ */
.segmented {
  display: flex; background: var(--surface-2); border-radius: var(--radius-sm);
  padding: 3px; margin-bottom: 16px; border: 1px solid var(--separator-light);
}
.seg-btn {
  flex: 1; padding: 7px 10px; border: none; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 600; color: var(--text-2); font-family: inherit;
  transition: all .22s var(--ease); background: transparent;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.active {
  background: var(--surface); color: var(--blue); box-shadow: var(--shadow-sm);
}
body.dark .seg-btn.active { box-shadow: 0 1px 4px rgba(0,0,0,.5); }

/* ============ Inputs ============ */
.tab-pane { display: none; }
.tab-pane.active { display: block; animation: fadeIn .25s var(--ease); }
textarea, input[type="text"] {
  width: 100%; padding: 12px 14px; border: 1px solid var(--separator);
  border-radius: var(--radius-md); font-size: 14px; font-family: inherit;
  background: var(--surface); color: var(--text); line-height: 1.7;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease); outline: none; resize: vertical;
}
textarea::placeholder, input::placeholder { color: var(--text-3); }
textarea { min-height: 150px; }
textarea:focus, input[type="text"]:focus {
  border-color: var(--blue); box-shadow: 0 0 0 4px rgba(0, 122, 255, .14);
}
.hint-line { margin-top: 10px; font-size: 11.5px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 4px 8px; }
.hint-line code {
  font-family: var(--font-mono, "SF Mono", Consolas, monospace); font-size: 10.5px;
  padding: 1px 6px; border-radius: 5px; background: var(--surface-2); color: var(--text-2);
}

/* ============ Drop zone ============ */
.drop-zone {
  border: 2px dashed var(--separator); border-radius: var(--radius-md);
  padding: 34px 20px; text-align: center; cursor: pointer; transition: all .2s var(--ease);
  background: var(--surface-2);
}
.drop-zone:hover, .drop-zone.dragover { border-color: var(--blue); background: rgba(0, 122, 255, .05); }
.drop-zone .dz-ico { font-size: 30px; display: block; margin-bottom: 8px; }
.drop-zone .dz-main { font-size: 13.5px; color: var(--text-2); font-weight: 600; }
.drop-zone .dz-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }

/* ============ Buttons ============ */
.btn-row { display: flex; gap: 14px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.btn {
  padding: 10px 22px; border: none; border-radius: var(--radius-md); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .2s var(--ease); display: inline-flex; align-items: center; gap: 8px;
  font-family: inherit; letter-spacing: -.01em;
}
.btn-primary {
  background: var(--grad-btn); color: #fff;
  box-shadow: 0 4px 14px rgba(10, 132, 255, .35);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(10, 132, 255, .45); }
.btn-primary:active { transform: translateY(0) scale(.97); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn svg { width: 14px; height: 14px; }

/* ============ Status ============ */
.status-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 180px; }
.status-badge {
  font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 7px; width: fit-content;
  transition: all .3s var(--ease); letter-spacing: 0;
}
.status-badge.idle { color: var(--text-3); background: var(--surface-2); }
.status-badge.running { color: var(--blue); background: rgba(0, 122, 255, .1); }
.status-badge.done { color: var(--green); background: rgba(52, 199, 89, .12); }
.status-badge.error { color: var(--red); background: rgba(255, 59, 48, .1); }
.spinner {
  width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor;
  border-top-color: transparent; animation: spin .7s linear infinite; display: none; flex-shrink: 0;
}
.status-badge.running .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress-bar { height: 3px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: none; flex: 1; }
.progress-bar.on { display: block; }
.progress-bar i { display: block; height: 100%; width: 35%; border-radius: 3px; background: var(--grad-btn); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

/* ============ Result tabs ============ */
.res-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--separator-light); margin-bottom: 18px; }
.res-tab {
  padding: 8px 14px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  color: var(--text-3); transition: color .2s var(--ease); background: none;
  border: none; border-bottom: 2.5px solid transparent; margin-bottom: -1px;
  display: flex; align-items: center; gap: 7px; font-family: inherit;
}
.res-tab:hover { color: var(--text); }
.res-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.res-pane { display: none; }
.res-pane.active { display: block; animation: fadeIn .3s var(--ease); }

/* ============ Flomo note（Apple Notes 风）============ */
.flomo-note { font-size: 13.5px; line-height: 1.85; }
.flomo-note .tag-line { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.flomo-note .tag-line span {
  font-size: 11.5px; font-weight: 600; padding: 3px 12px; border-radius: 999px;
  border: 1px solid transparent; transition: transform .2s var(--ease);
}
.flomo-note .tag-line span:nth-child(1) { background: rgba(0,122,255,.1); color: var(--blue); border-color: rgba(0,122,255,.2); }
.flomo-note .tag-line span:nth-child(2) { background: rgba(175,82,222,.1); color: var(--purple); border-color: rgba(175,82,222,.22); }
.flomo-note .tag-line span:nth-child(3) { background: rgba(255,149,0,.1); color: var(--orange); border-color: rgba(255,149,0,.22); }
.flomo-note .tag-line span:nth-child(4) { background: rgba(52,199,89,.1); color: var(--green); border-color: rgba(52,199,89,.22); }
.flomo-note .tag-line span:nth-child(5) { background: rgba(255,45,85,.1); color: var(--pink); border-color: rgba(255,45,85,.22); }
.flomo-note .tag-line span:nth-child(6) { background: rgba(48,176,199,.1); color: var(--teal); border-color: rgba(48,176,199,.22); }
.flomo-note .tag-line span:nth-child(n+7) { background: rgba(88,86,214,.1); color: var(--indigo); border-color: rgba(88,86,214,.22); }
.flomo-note .tag-line span:hover { transform: scale(1.05); }
.flomo-note .bold-title {
  font-size: 16px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 4px;
}
.flomo-note .source { color: var(--text-3); font-size: 12px; margin-bottom: 14px; }
.flomo-note .concept { margin-bottom: 8px; }
.flomo-note .subconcept { margin-bottom: 5px; padding-left: 16px; position: relative; color: var(--text-2); }
.flomo-note .subconcept::before {
  content: ""; position: absolute; left: 3px; top: 10px; width: 6px; height: 6px;
  border-radius: 50%; background: var(--blue); opacity: .55;
}
.flomo-note mark {
  background: linear-gradient(180deg, transparent 12%, var(--mark-bg) 12%, var(--mark-bg) 88%, transparent 88%);
  color: var(--mark-text); padding: 0 2px; font-weight: 500; border-radius: 2px;
}
.flomo-note strong { font-weight: 700; }
.note-meta {
  margin-top: 14px; padding: 9px 14px; background: rgba(52,199,89,.1);
  border: 1px solid rgba(52,199,89,.22); border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--green); font-weight: 600; display: flex; align-items: center; gap: 8px;
}

/* ============ Compare ============ */
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.compare-col { min-width: 0; }
.compare-label {
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.compare-label.new { color: var(--blue); }
.compare-label.old { color: var(--orange); }
.compare-label::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.compare-panel {
  background: var(--surface-2); border: 1px solid var(--separator-light); border-radius: var(--radius-md);
  padding: 14px 16px; max-height: 440px; overflow-y: auto; font-size: 12.5px; line-height: 1.8;
}
.compare-panel mark { background: var(--mark-bg); color: var(--mark-text); padding: 0 2px; border-radius: 3px; }
.decision-bar {
  padding: 11px 14px; border-radius: var(--radius-md); margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600;
  animation: fadeIn .3s var(--ease);
}
.decision-bar.force-new { background: rgba(0,122,255,.08); border: 1px solid rgba(0,122,255,.2); color: var(--blue); }
.decision-bar.update { background: rgba(255,149,0,.08); border: 1px solid rgba(255,149,0,.2); color: var(--orange); }
.decision-bar.skip { background: var(--surface-2); border: 1px solid var(--separator-light); color: var(--text-2); }
.decision-icon { font-size: 15px; }
.relevance-line { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12.5px; color: var(--text-2); }
.relevance-badge { font-size: 12px; font-weight: 700; padding: 3px 11px; border-radius: 999px; }
.relevance-high { background: rgba(255,59,48,.1); color: var(--red); }
.relevance-low { background: rgba(52,199,89,.12); color: var(--green); }

/* ============ Log ============ */
.raw-log {
  background: var(--code-bg); color: var(--code-text); padding: 14px 16px;
  border-radius: var(--radius-md); font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
  font-size: 11.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-all;
  overflow-x: auto; max-height: 520px; overflow-y: auto;
}
.raw-log::-webkit-scrollbar { width: 8px; }
.raw-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 4px; }

/* ============ Misc ============ */
.empty-state { color: var(--text-3); font-size: 13px; text-align: center; padding: 30px 0; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn .35s var(--ease); }

@media (max-width: 680px) {
  .container { padding: 0 12px 60px; }
  .card { padding: 18px; }
  .page-head h2 { font-size: 24px; }
  .compare-grid { grid-template-columns: 1fr; }
  .btn-row { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>mynews</h1>
      <small>知识笔记处理器</small>
    </div>
  </div>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换夜色模式">
    <svg id="themeIcoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
    <svg id="themeIcoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
</div>

<div class="container">

<div class="page-head fade-in">
  <h2>新建笔记</h2>
  <p>输入内容，AI 自动分析、查重并同步至 flomo</p>
</div>

<div class="card fade-in">
  <div class="card-title"><span class="t-dot"></span> 输入内容</div>
  <div class="segmented">
    <button class="seg-btn active" onclick="switchTab('text')">📝 正文</button>
    <button class="seg-btn" onclick="switchTab('url')">🔗 URL</button>
    <button class="seg-btn" onclick="switchTab('image')">🖼️ 图片</button>
  </div>
  <div id="tab-text" class="tab-pane active">
    <textarea id="content" placeholder="粘贴文章正文或笔记内容…"></textarea>
    <div class="hint-line">
      允许 <code>**加粗**</code> <code>&lt;mark&gt;高亮&lt;/mark&gt;</code> <code>- 列表</code>
      · 禁止 <code># 标题</code> <code>链接</code> <code>表格</code> <code>引用</code>
    </div>
  </div>
  <div id="tab-url" class="tab-pane">
    <input type="text" id="url" placeholder="https://example.com/article">
    <div class="hint-line">自动抓取网页正文后交给 AI 分析</div>
  </div>
  <div id="tab-image" class="tab-pane">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="dz-ico">🖼️</span>
      <div class="dz-main">点击上传或拖拽图片</div>
      <div class="dz-sub">JPG / PNG / WebP · AI 自动提取文字</div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="previewImage(event)">
    </div>
    <div id="imagePreview" style="display:none;margin-top:14px;position:relative">
      <img id="previewImg" style="max-width:100%;max-height:280px;border-radius:12px;border:1px solid var(--separator);box-shadow:var(--shadow-md)">
      <button class="btn" style="position:absolute;top:8px;right:8px;padding:5px 11px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600" onclick="clearImage()">✕ 移除</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="submitBtn" onclick="process()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
      处理并上传
    </button>
    <div class="status-wrap">
      <span class="status-badge idle" id="status"><span class="spinner"></span> 就绪</span>
      <div class="progress-bar" id="progressBar"><i></i></div>
    </div>
  </div>
</div>

<div id="result-section" style="display:none">
  <div class="card fade-in">
    <div class="res-tabs">
      <button class="res-tab active" onclick="switchRes('note')">📄 笔记</button>
      <button class="res-tab" onclick="switchRes('compare')">🔍 对比</button>
      <button class="res-tab" onclick="switchRes('log')">📋 日志</button>
    </div>
    <div id="res-note" class="res-pane active"></div>
    <div id="res-compare" class="res-pane"></div>
    <div id="res-log" class="res-pane"></div>
  </div>
</div>

</div>

<script>
function toggleTheme() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('themeIcoMoon').style.display = isDark ? 'none' : 'block';
  document.getElementById('themeIcoSun').style.display = isDark ? 'block' : 'none';
  localStorage.setItem('mynews-theme', isDark ? 'dark' : 'light');
}
(function() {
  if (localStorage.getItem('mynews-theme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeIcoMoon').style.display = 'none';
    document.getElementById('themeIcoSun').style.display = 'block';
  }
})();

function switchTab(tab) {
  document.querySelectorAll('.seg-btn').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(t => t.classList.remove('active'));
  document.querySelector(`.seg-btn[onclick*="'${tab}'"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}
function switchRes(tab) {
  document.querySelectorAll('.res-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.res-pane').forEach(t => t.classList.remove('active'));
  document.querySelector(`.res-tab[onclick*="'${tab}'"]`).classList.add('active');
  document.getElementById(`res-${tab}`).classList.add('active');
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderFlomoNote(text) {
  let html = '<div class="flomo-note">';
  for (const line of text.split('\n')) {
    if (line.startsWith('#')) {
      const tags = line.split(/\s+/).filter(Boolean).map(t => `<span>${escapeHtml(t)}</span>`).join('');
      html += `<div class="tag-line">${tags}</div>`;
    } else if (/^\*\*.*\*\*$/.test(line.trim()) && !line.includes('**来源**') && !line.includes('**概念**') ) {
      html += `<div class="bold-title">${escapeHtml(line).replace(/\*\*/g, '')}</div>`;
    } else if (line.startsWith('**来源**')) {
      html += `<div class="source">${escapeHtml(line)}</div>`;
    } else if (line.startsWith('**概念**')) {
      html += `<div class="concept">${line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/<mark>(.*?)<\/mark>/g, '<mark>$1</mark>')}</div>`;
    } else if (line.startsWith('- ')) {
      html += `<div class="subconcept">${line.slice(2).replace(/<mark>(.*?)<\/mark>/g, '<mark>$1</mark>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>`;
    } else if (line.trim() === '') {
      html += '<div style="height:6px"></div>';
    } else {
      html += `<div>${escapeHtml(line)}</div>`;
    }
  }
  html += '</div>';
  return html;
}

function parseMarkers(text) {
  const sections = {};
  const m1 = text.match(/==BEGIN_FLOMO_NOTE==\n([\s\S]*?)==END_FLOMO_NOTE==/);
  if (m1) sections.flomoNote = m1[1].trim();
  const m2 = text.match(/==BEGIN_OLD_MARKDOWN==\n([\s\S]*?)==END_OLD_MARKDOWN==/);
  if (m2) sections.oldNote = m2[1].trim();
  const m3 = text.match(/==BEGIN_NEW_MARKDOWN==\n([\s\S]*?)==END_NEW_MARKDOWN==/);
  if (m3) sections.newNote = m3[1].trim();
  const m4 = text.match(/旧笔记 id=([a-zA-Z0-9_]+)/);
  if (m4) sections.oldId = m4[1];
  const m5 = text.match(/上传成功 id=([a-zA-Z0-9_]+)/);
  if (m5) sections.newId = m5[1];
  const m6 = text.match(/relevance=([\d.]+)/);
  if (m6) sections.relevance = parseFloat(m6[1]);
  const m7 = text.match(/\[auto\] AI 决定：(.+?)(?:\n|$)/);
  if (m7) sections.aiDecision = m7[1].trim();
  return sections;
}

function renderResults(data) {
  const sections = parseMarkers(data.output || '');
  const log = data.output || '';

  // Note tab
  const noteDiv = document.getElementById('res-note');
  if (sections.flomoNote) {
    noteDiv.innerHTML = renderFlomoNote(sections.flomoNote);
    if (sections.newId) noteDiv.innerHTML += `<div class="note-meta">✓ 已上传 · flomo ID: ${escapeHtml(sections.newId)}</div>`;
  } else if (data.success) {
    const skipped = (data.output || '').includes('无增量 → 跳过') || (data.output || '').includes('已跳过');
    noteDiv.innerHTML = skipped
      ? '<div class="empty-state">⏭️ 已跳过（与已有笔记重复，无增量）</div>'
      : '<div class="empty-state">✓ 已上传成功</div>';
  } else {
    noteDiv.innerHTML = '<div class="empty-state" style="color:var(--red)">处理未完成，请查看日志</div>';
  }

  // Compare tab
  const compDiv = document.getElementById('res-compare');
  if (sections.oldNote) {
    let html = '';
    if (sections.relevance !== undefined) {
      const pct = Math.round(sections.relevance * 100);
      const cls = sections.relevance >= 0.9 ? 'relevance-high' : 'relevance-low';
      html += `<div class="relevance-line">与已有笔记相似度 <span class="relevance-badge ${cls}">${pct}%</span></div>`;
    }
    if (sections.aiDecision) {
      const isForceNew = sections.aiDecision.includes('强制新建');
      const isUpdate = sections.aiDecision.includes('更新');
      const isSkip = sections.aiDecision.includes('跳过');
      let cls = 'skip', icon = '⏭️';
      if (isForceNew) { cls = 'force-new'; icon = '🆕'; }
      else if (isUpdate) { cls = 'update'; icon = '📝'; }
      html += `<div class="decision-bar ${cls}"><span class="decision-icon">${icon}</span> ${escapeHtml(sections.aiDecision)}</div>`;
    }
    html += '<div class="compare-grid">' +
      '<div class="compare-col"><div class="compare-label new">新内容</div><div class="compare-panel">' + renderFlomoNote(sections.newNote || '(无)') + '</div></div>' +
      '<div class="compare-col"><div class="compare-label old">已有笔记</div><div class="compare-panel">' + renderFlomoNote(sections.oldNote) + '</div></div>' +
      '</div>';
    compDiv.innerHTML = html;
  } else {
    compDiv.innerHTML = '<div class="empty-state">未检测到相似笔记，已直接上传</div>';
  }

  // Log tab
  document.getElementById('res-log').innerHTML = `<div class="raw-log">${escapeHtml(log)}</div>`;
  document.getElementById('result-section').style.display = 'block';
}

let uploadedFile = null;

function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  uploadedFile = file;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('previewImg').src = ev.target.result;
    document.getElementById('imagePreview').style.display = 'block';
    document.getElementById('dropZone').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  uploadedFile = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('dropZone').style.display = 'block';
}

// Drag & drop support
const dropZone = document.getElementById('dropZone');
if (dropZone) {
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      document.getElementById('fileInput').files = e.dataTransfer.files;
      previewImage({ target: { files: [file] } });
    }
  });
}

async function process() {
  const content = document.getElementById('content').value.trim();
  const url = document.getElementById('url').value.trim();
  const hasImage = !!uploadedFile;

  if (!content && !url && !hasImage) {
    setStatus('请填写内容或上传图片', 'error');
    return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerHTML = '处理中…';
  setStatus('AI 分析中…', 'running');
  document.getElementById('progressBar').classList.add('on');
  document.getElementById('result-section').style.display = 'none';

  let body;
  const headers = {};
  if (hasImage) {
    const fd = new FormData();
    fd.append('image', uploadedFile);
    body = fd;
  } else {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify({ content, url });
  }

  try {
    const resp = await fetch('/process', {
      method: 'POST',
      headers: headers,
      body: body
    });
    const data = await resp.json();
    renderResults(data);
    setStatus(data.success ? (data.output.includes('跳过') ? '已跳过（重复）' : '处理完成') : '处理失败',
              data.success ? 'done' : 'error');
  } catch (e) {
    document.getElementById('res-log').innerHTML = `<div class="raw-log">请求失败: ${escapeHtml(e.message)}</div>`;
    document.getElementById('result-section').style.display = 'block';
    setStatus('网络错误', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg> 处理并上传';
    document.getElementById('progressBar').classList.remove('on');
  }
}

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.innerHTML = `<span class="spinner"></span> ${text}`;
  el.className = `status-badge ${cls}`;
}
</script>
</body>
</html>
