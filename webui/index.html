<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mynews — 知识笔记处理器</title>
<style>
/* ===== Design Tokens ===== */
:root {
  --bg: #f4f5fb;
  --bg-grad-a: rgba(99, 102, 241, .07);
  --bg-grad-b: rgba(236, 72, 153, .05);
  --surface: #ffffff;
  --surface-2: #f8f9fd;
  --text: #171a2b;
  --text-2: #5b6178;
  --text-3: #9aa0b8;
  --border: #e6e8f2;
  --border-strong: #d4d8ea;
  --accent: #6366f1;
  --accent-2: #a855f7;
  --accent-soft: #eef0ff;
  --green: #10b981;
  --red: #ef4444;
  --orange: #f59e0b;
  --blue: #3b82f6;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 2px rgba(23, 26, 43, .04), 0 1px 3px rgba(23, 26, 43, .05);
  --shadow-md: 0 4px 16px rgba(23, 26, 43, .07), 0 2px 6px rgba(23, 26, 43, .04);
  --shadow-lg: 0 16px 40px rgba(23, 26, 43, .12), 0 4px 12px rgba(23, 26, 43, .06);
  --input-bg: #ffffff;
  --code-bg: #151826;
  --code-text: #e2e5f1;
  --mark-bg: #fdeeb6;
  --mark-text: #7a5200;
  --tag-color: #6366f1;
  --grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #a855f7 100%);
  --grad-soft: linear-gradient(135deg, #eef0ff 0%, #faf5ff 100%);
}
body.dark {
  --bg: #0d0f1d;
  --bg-grad-a: rgba(99, 102, 241, .10);
  --bg-grad-b: rgba(168, 85, 247, .07);
  --surface: #171a2e;
  --surface-2: #1c1f38;
  --text: #e6e8f5;
  --text-2: #a0a5c0;
  --text-3: #6b7190;
  --border: #262a47;
  --border-strong: #343963;
  --accent: #818cf8;
  --accent-2: #c084fc;
  --accent-soft: #232649;
  --green: #34d399;
  --red: #f87171;
  --orange: #fbbf24;
  --blue: #60a5fa;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.25), 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
  --shadow-lg: 0 16px 40px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.3);
  --input-bg: #1a1d33;
  --code-bg: #0b0d18;
  --code-text: #d5d9ec;
  --mark-bg: #4a3800;
  --mark-text: #fcd34d;
  --tag-color: #a5b4fc;
  --grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #a855f7 100%);
  --grad-soft: linear-gradient(135deg, #1d2040 0%, #221a3a 100%);
}

/* ===== Base ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Display", "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, var(--bg-grad-a), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, var(--bg-grad-b), transparent 55%),
    var(--bg);
  color: var(--text); min-height: 100vh;
  transition: background .35s, color .35s;
  -webkit-font-smoothing: antialiased;
}

/* ===== Header ===== */
.header {
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  border-bottom: 1px solid var(--border);
  padding: 14px 28px; display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 100; backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: background .35s, border-color .35s;
}
.brand { display: flex; align-items: center; gap: 12px; flex: 1; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 11px; background: var(--grad);
  display: flex; align-items: center; justify-content: center; color: #fff;
  box-shadow: 0 4px 14px rgba(99, 102, 241, .35);
}
.brand-logo svg { width: 20px; height: 20px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text h1 { font-size: 17px; font-weight: 800; letter-spacing: -.2px; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.brand-text small { font-size: 11px; color: var(--text-3); font-weight: 500; letter-spacing: .4px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s; box-shadow: var(--shadow-sm);
}
.icon-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
.icon-btn svg { width: 18px; height: 18px; }

/* ===== Layout ===== */
.container { max-width: 860px; margin: 0 auto; padding: 28px 20px 64px; }
.card {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 24px; margin-bottom: 22px;
  box-shadow: var(--shadow-sm); transition: background .35s, border-color .35s, box-shadow .3s;
}
.card:hover { box-shadow: var(--shadow-md); }
.card-title { font-size: 14px; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; letter-spacing: .2px; }
.card-title .title-icon {
  width: 30px; height: 30px; border-radius: 9px; background: var(--grad-soft);
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  border: 1px solid var(--border);
}

/* ===== Input tabs ===== */
.input-tabs {
  display: flex; gap: 4px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 12px; padding: 4px;
}
.tab-btn {
  flex: 1; padding: 9px 14px; border: none; background: transparent; border-radius: 9px;
  cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-2);
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: all .22s; font-family: inherit;
}
.tab-btn .tab-ico { font-size: 14px; opacity: .85; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  background: var(--surface); color: var(--accent);
  box-shadow: 0 1px 4px rgba(23, 26, 43, .09), 0 0 0 1px var(--border);
}
body.dark .tab-btn.active { box-shadow: 0 1px 4px rgba(0,0,0,.4), 0 0 0 1px var(--border-strong); }
.tab-pane { display: none; padding-top: 16px; }
.tab-pane.active { display: block; animation: fadeUp .25s ease; }

textarea, input[type="text"] {
  width: 100%; padding: 14px 16px; border: 1.5px solid var(--border);
  border-radius: 12px; font-size: 14px; font-family: inherit;
  background: var(--input-bg); color: var(--text); line-height: 1.7;
  transition: border .2s, box-shadow .2s, background .3s; outline: none; resize: vertical;
}
textarea::placeholder, input::placeholder { color: var(--text-3); }
textarea { min-height: 150px; }
textarea:focus, input[type="text"]:focus {
  border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft);
}

/* ===== Drop zone ===== */
.drop-zone {
  border: 2px dashed var(--border-strong); border-radius: 14px; padding: 38px 24px;
  text-align: center; cursor: pointer; transition: all .25s; background: var(--surface-2);
}
.drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
.drop-zone .dz-ico { font-size: 38px; margin-bottom: 10px; display: block; }
.drop-zone .dz-main { font-size: 14px; color: var(--text-2); font-weight: 500; }
.drop-zone .dz-sub { font-size: 12px; color: var(--text-3); margin-top: 6px; }

/* ===== Buttons ===== */
.btn-row { display: flex; gap: 14px; align-items: center; margin-top: 18px; }
.btn {
  padding: 12px 26px; border: none; border-radius: 12px; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all .22s; display: inline-flex; align-items: center; gap: 8px;
  font-family: inherit; letter-spacing: .2px;
}
.btn-primary {
  background: var(--grad); color: #fff;
  box-shadow: 0 6px 18px rgba(99, 102, 241, .32);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(99, 102, 241, .42); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }

/* ===== Status ===== */
.status-wrap { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.status-badge {
  font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px; width: fit-content;
  transition: all .3s;
}
.status-badge.idle { color: var(--text-3); background: var(--surface-2); border: 1px solid var(--border); }
.status-badge.running { color: var(--accent); background: var(--accent-soft); }
.status-badge.done { color: var(--green); background: color-mix(in srgb, var(--green) 12%, transparent); }
.status-badge.error { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
.status-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status-badge.running .dot { animation: pulse 1.1s ease infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
.progress-bar { height: 3px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: none; }
.progress-bar.on { display: block; }
.progress-bar i {
  display: block; height: 100%; width: 40%; border-radius: 3px; background: var(--grad);
  animation: slide 1.2s ease-in-out infinite;
}
@keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }

/* ===== Result tabs ===== */
.res-tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.res-tab {
  padding: 11px 20px; cursor: pointer; font-size: 13px; font-weight: 600;
  color: var(--text-3); transition: all .2s; background: none;
  border: none; border-bottom: 2.5px solid transparent; margin-bottom: -1px;
  display: flex; align-items: center; gap: 7px; font-family: inherit;
}
.res-tab:hover { color: var(--text); }
.res-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.res-pane { display: none; padding-top: 4px; }
.res-pane.active { display: block; animation: fadeUp .3s ease; }

/* ===== Flomo note render ===== */
.flomo-note {
  font-size: 14px; line-height: 1.85; padding: 22px 24px;
  background: var(--surface-2); border-radius: 14px;
  border: 1px solid var(--border); border-left: 4px solid var(--accent);
  transition: background .35s, border-color .35s;
}
.flomo-note .tag-line {
  color: var(--tag-color); font-size: 12px; font-weight: 600;
  margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px;
}
.flomo-note .tag-line span {
  background: var(--accent-soft); padding: 3px 10px; border-radius: 999px;
}
.flomo-note .bold-title { font-weight: 800; font-size: 15.5px; margin-bottom: 6px; letter-spacing: -.2px; }
.flomo-note .source { color: var(--text-3); font-size: 12px; margin-bottom: 14px; display: flex; align-items: center; gap: 5px; }
.flomo-note .concept { margin-bottom: 10px; }
.flomo-note .subconcept { margin-bottom: 4px; padding-left: 2px; }
.flomo-note .subconcept::before { content: "•"; color: var(--accent); font-weight: 700; margin-right: 8px; }
.flomo-note mark {
  background: var(--mark-bg); color: var(--mark-text); padding: 1.5px 5px;
  border-radius: 5px; font-weight: 600;
}
.flomo-note strong { font-weight: 700; }
.note-meta {
  margin-top: 14px; padding: 10px 14px; background: var(--accent-soft);
  border-radius: 10px; font-size: 12px; color: var(--accent); font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}

/* ===== Compare ===== */
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.compare-panel {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px; max-height: 460px; overflow-y: auto; font-size: 13px; line-height: 1.75;
  transition: background .35s;
}
.compare-panel mark { background: var(--mark-bg); color: var(--mark-text); padding: 1px 4px; border-radius: 4px; }
.compare-label {
  font-size: 11px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
.compare-label.new { color: var(--accent); }
.compare-label.old { color: var(--orange); }
.compare-label::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: currentColor; }
.decision-bar {
  padding: 13px 16px; border-radius: 12px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 11px; font-size: 13px; font-weight: 700;
  background: var(--accent-soft); border: 1px solid var(--border);
}
.decision-bar.force-new { background: color-mix(in srgb, var(--blue) 10%, transparent); border-color: color-mix(in srgb, var(--blue) 30%, transparent); }
.decision-bar.update { background: color-mix(in srgb, var(--orange) 10%, transparent); border-color: color-mix(in srgb, var(--orange) 30%, transparent); }
.decision-bar.skip { background: var(--surface-2); }
.decision-icon {
  width: 32px; height: 32px; border-radius: 9px; display: flex;
  align-items: center; justify-content: center; font-size: 16px;
  background: var(--surface); box-shadow: var(--shadow-sm); flex-shrink: 0;
}
.relevance-badge {
  display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 700;
}
.relevance-high { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
.relevance-low { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }

/* ===== Raw log ===== */
.raw-log {
  background: var(--code-bg); color: var(--code-text); padding: 18px 20px;
  border-radius: 14px; font-family: "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, monospace;
  font-size: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-all;
  overflow-x: auto; max-height: 520px; overflow-y: auto;
  box-shadow: inset 0 1px 4px rgba(0,0,0,.25);
}

/* ===== Animations ===== */
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeUp .35s ease; }

/* ===== Responsive ===== */
@media (max-width: 680px) {
  .container { padding: 18px 12px 48px; }
  .card { padding: 18px; }
  .compare-grid { grid-template-columns: 1fr; }
  .header { padding: 12px 16px; }
  .tab-btn { font-size: 12px; padding: 8px 8px; }
  .btn-row { flex-direction: column; align-items: stretch; }
  .btn-primary { justify-content: center; }
  .status-wrap { align-items: flex-start; }
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>
        <path d="M19 3v4M21 5h-4"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>mynews</h1>
      <small>知识笔记处理器 · flomo</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换夜色模式">
      <svg id="themeIcoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg id="themeIcoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</div>

<div class="container">

<div class="card fade-in">
  <div class="card-title"><span class="title-icon">📥</span> 输入内容</div>
  <div class="input-tabs">
    <button class="tab-btn active" onclick="switchTab('text')"><span class="tab-ico">📝</span> 正文</button>
    <button class="tab-btn" onclick="switchTab('url')"><span class="tab-ico">🔗</span> URL</button>
    <button class="tab-btn" onclick="switchTab('image')"><span class="tab-ico">🖼️</span> 图片</button>
  </div>
  <div id="tab-text" class="tab-pane active">
    <textarea id="content" placeholder="粘贴文章正文或笔记内容…"></textarea>
  </div>
  <div id="tab-url" class="tab-pane">
    <input type="text" id="url" placeholder="https://example.com/article">
  </div>
  <div id="tab-image" class="tab-pane">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="dz-ico">🖼️</span>
      <div class="dz-main">点击上传或拖拽图片到此处</div>
      <div class="dz-sub">支持 JPG / PNG / WebP，AI 自动提取文字</div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="previewImage(event)">
    </div>
    <div id="imagePreview" style="display:none;margin-top:14px;position:relative">
      <img id="previewImg" style="max-width:100%;max-height:300px;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow-md)">
      <button class="btn" style="position:absolute;top:10px;right:10px;padding:6px 12px;background:rgba(15,17,30,.65);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;backdrop-filter:blur(6px)" onclick="clearImage()">✕ 移除</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="submitBtn" onclick="process()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
      处理并上传
    </button>
    <div class="status-wrap">
      <span class="status-badge idle" id="status"><span class="dot"></span> 就绪</span>
      <div class="progress-bar" id="progressBar"><i></i></div>
    </div>
  </div>
</div>

<div id="result-section" style="display:none">
  <div class="card fade-in">
    <div class="res-tabs">
      <button class="res-tab active" onclick="switchRes('note')"><span>📄</span> 笔记</button>
      <button class="res-tab" onclick="switchRes('compare')"><span>🔍</span> 对比</button>
      <button class="res-tab" onclick="switchRes('log')"><span>📋</span> 日志</button>
    </div>
    <div id="res-note" class="res-pane active"></div>
    <div id="res-compare" class="res-pane"></div>
    <div id="res-log" class="res-pane"></div>
  </div>
</div>

</div>

<script>
function toggleTheme() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('themeIcoMoon').style.display = isDark ? 'none' : 'block';
  document.getElementById('themeIcoSun').style.display = isDark ? 'block' : 'none';
  localStorage.setItem('mynews-theme', isDark ? 'dark' : 'light');
}
(function() {
  if (localStorage.getItem('mynews-theme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeIcoMoon').style.display = 'none';
    document.getElementById('themeIcoSun').style.display = 'block';
  }
})();

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick*="'${tab}'"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}
function switchRes(tab) {
  document.querySelectorAll('.res-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.res-pane').forEach(t => t.classList.remove('active'));
  document.querySelector(`.res-tab[onclick*="'${tab}'"]`).classList.add('active');
  document.getElementById(`res-${tab}`).classList.add('active');
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderFlomoNote(text) {
  let html = '<div class="flomo-note">';
  for (const line of text.split('\n')) {
    if (line.startsWith('#')) {
      const tags = line.split(/\s+/).filter(Boolean).map(t => `<span>${escapeHtml(t)}</span>`).join('');
      html += `<div class="tag-line">${tags}</div>`;
    } else if (/^\*\*.*\*\*$/.test(line.trim()) && !line.includes('**来源**') && !line.includes('**概念**') ) {
      html += `<div class="bold-title">${escapeHtml(line)}</div>`;
    } else if (line.startsWith('**来源**')) {
      html += `<div class="source">${escapeHtml(line)}</div>`;
    } else if (line.startsWith('**概念**')) {
      html += `<div class="concept">${line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/<mark>(.*?)<\/mark>/g, '<mark>$1</mark>')}</div>`;
    } else if (line.startsWith('- ')) {
      html += `<div class="subconcept">${line.slice(2).replace(/<mark>(.*?)<\/mark>/g, '<mark>$1</mark>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>`;
    } else if (line.trim() === '') {
      html += '<div style="height:8px"></div>';
    } else {
      html += `<div>${escapeHtml(line)}</div>`;
    }
  }
  html += '</div>';
  return html;
}

function parseMarkers(text) {
  const sections = {};
  const m1 = text.match(/==BEGIN_FLOMO_NOTE==\n([\s\S]*?)==END_FLOMO_NOTE==/);
  if (m1) sections.flomoNote = m1[1].trim();
  const m2 = text.match(/==BEGIN_OLD_MARKDOWN==\n([\s\S]*?)==END_OLD_MARKDOWN==/);
  if (m2) sections.oldNote = m2[1].trim();
  const m3 = text.match(/==BEGIN_NEW_MARKDOWN==\n([\s\S]*?)==END_NEW_MARKDOWN==/);
  if (m3) sections.newNote = m3[1].trim();
  const m4 = text.match(/旧笔记 id=([a-zA-Z0-9_]+)/);
  if (m4) sections.oldId = m4[1];
  const m5 = text.match(/上传成功 id=([a-zA-Z0-9_]+)/);
  if (m5) sections.newId = m5[1];
  const m6 = text.match(/relevance=([\d.]+)/);
  if (m6) sections.relevance = parseFloat(m6[1]);
  const m7 = text.match(/\[auto\] AI 决定：(.+?)(?:\n|$)/);
  if (m7) sections.aiDecision = m7[1].trim();
  return sections;
}

function renderResults(data) {
  const sections = parseMarkers(data.output || '');
  const log = data.output || '';

  // Note tab
  const noteDiv = document.getElementById('res-note');
  if (sections.flomoNote) {
    noteDiv.innerHTML = renderFlomoNote(sections.flomoNote);
    if (sections.newId) noteDiv.innerHTML += `<div class="note-meta">✅ 已上传 · flomo ID: ${escapeHtml(sections.newId)}</div>`;
  } else if (data.success) {
    const skipped = (data.output || '').includes('无增量 → 跳过') || (data.output || '').includes('已跳过');
    noteDiv.innerHTML = `<div style="color:${skipped ? 'var(--orange)' : 'var(--text-2)'};font-size:14px;text-align:center;padding:36px 0">${skipped ? '⏭️ 已跳过（与已有笔记重复，无增量）' : '✅ 已上传成功，笔记内容未捕获'}</div>`;
  } else {
    noteDiv.innerHTML = '<div style="color:var(--red);font-size:14px;text-align:center;padding:36px 0">❌ 处理未完成，请查看日志</div>';
  }

  // Compare tab
  const compDiv = document.getElementById('res-compare');
  if (sections.oldNote) {
    let html = '';
    if (sections.relevance !== undefined) {
      const pct = Math.round(sections.relevance * 100);
      const cls = sections.relevance >= 0.9 ? 'relevance-high' : 'relevance-low';
      html += `<div style="margin-bottom:14px;font-size:13px;color:var(--text-2)">与已有笔记相似度 <span class="relevance-badge ${cls}">${pct}%</span></div>`;
    }
    if (sections.aiDecision) {
      const isForceNew = sections.aiDecision.includes('强制新建');
      const isUpdate = sections.aiDecision.includes('更新');
      const isSkip = sections.aiDecision.includes('跳过');
      let cls = 'skip', icon = '⏭️';
      if (isForceNew) { cls = 'force-new'; icon = '🆕'; }
      else if (isUpdate) { cls = 'update'; icon = '📝'; }
      html += `<div class="decision-bar ${cls}"><span class="decision-icon">${icon}</span> ${escapeHtml(sections.aiDecision)}</div>`;
    }
    html += '<div class="compare-grid">' +
      '<div><div class="compare-label new">新内容</div><div class="compare-panel">' + renderFlomoNote(sections.newNote || '(无)') + '</div></div>' +
      '<div><div class="compare-label old">已有笔记</div><div class="compare-panel">' + renderFlomoNote(sections.oldNote) + '</div></div>' +
      '</div>';
    compDiv.innerHTML = html;
  } else {
    compDiv.innerHTML = '<div style="color:var(--text-3);font-size:14px;text-align:center;padding:28px 0">未检测到相似笔记，已直接上传</div>';
  }

  // Log tab
  document.getElementById('res-log').innerHTML = `<div class="raw-log">${escapeHtml(log)}</div>`;
  document.getElementById('result-section').style.display = 'block';
  document.getElementById('result-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

let uploadedFile = null;

function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  uploadedFile = file;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('previewImg').src = ev.target.result;
    document.getElementById('imagePreview').style.display = 'block';
    document.getElementById('dropZone').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  uploadedFile = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('dropZone').style.display = 'block';
}

// Drag & drop support
const dropZone = document.getElementById('dropZone');
if (dropZone) {
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      document.getElementById('fileInput').files = e.dataTransfer.files;
      previewImage({ target: { files: [file] } });
    }
  });
}

async function process() {
  const content = document.getElementById('content').value.trim();
  const url = document.getElementById('url').value.trim();
  const hasImage = !!uploadedFile;

  if (!content && !url && !hasImage) {
    setStatus('⚠️ 请填写内容或上传图片', 'error');
    return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '处理中…';
  setStatus('AI 分析中…', 'running');
  document.getElementById('progressBar').classList.add('on');
  document.getElementById('result-section').style.display = 'none';

  let body;
  const headers = {};
  if (hasImage) {
    const fd = new FormData();
    fd.append('image', uploadedFile);
    body = fd;
  } else {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify({ content, url });
  }

  try {
    const resp = await fetch('/process', {
      method: 'POST',
      headers: headers,
      body: body
    });
    const data = await resp.json();
    renderResults(data);
    setStatus(data.success ? (data.output.includes('跳过') ? '已跳过（重复）' : '处理完成') : '处理失败',
              data.success ? 'done' : 'error');
  } catch (e) {
    document.getElementById('res-log').innerHTML = `<div class="raw-log">请求失败: ${escapeHtml(e.message)}</div>`;
    document.getElementById('result-section').style.display = 'block';
    setStatus('网络错误', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg> 处理并上传';
    document.getElementById('progressBar').classList.remove('on');
  }
}

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.innerHTML = `<span class="dot"></span> ${text}`;
  el.className = `status-badge ${cls}`;
}
</script>
</body>
</html>
