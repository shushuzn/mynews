<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mynews — 知识笔记处理器</title>
<style>
/* ============ Design System（Linear / Vercel 风格）============ */
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f4f4f5;
  --surface-3: #fafafa;
  --text: #18181b;
  --text-2: #71717a;
  --text-3: #a1a1aa;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: #eef2ff;
  --accent-border: #c7d2fe;
  --green: #16a34a;
  --green-soft: #f0fdf4;
  --green-border: #bbf7d0;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --red-border: #fecaca;
  --orange: #d97706;
  --orange-soft: #fffbeb;
  --orange-border: #fde68a;
  --blue: #2563eb;
  --mark-bg: #fef08a;
  --mark-text: #854d0e;
  --code-bg: #18181b;
  --code-text: #d4d4d8;
  --radius: 10px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .04);
  --font-mono: "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
}
body.dark {
  --bg: #09090b;
  --surface: #101014;
  --surface-2: #1a1a1f;
  --surface-3: #16161a;
  --text: #fafafa;
  --text-2: #a1a1aa;
  --text-3: #71717a;
  --border: #27272a;
  --border-strong: #3f3f46;
  --accent: #818cf8;
  --accent-hover: #a5b4fc;
  --accent-soft: #1e1b4b;
  --accent-border: #3730a3;
  --green: #4ade80;
  --green-soft: #052e16;
  --green-border: #166534;
  --red: #f87171;
  --red-soft: #450a0a;
  --red-border: #7f1d1d;
  --orange: #fbbf24;
  --orange-soft: #451a03;
  --orange-border: #78350f;
  --blue: #60a5fa;
  --mark-bg: #713f12;
  --mark-text: #fde68a;
  --code-bg: #0c0c0e;
  --code-text: #a1a1aa;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, .4), 0 1px 3px rgba(0, 0, 0, .3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Display", "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  font-size: 14px; line-height: 1.6; color: var(--text); background: var(--bg);
  transition: background .3s, color .3s; -webkit-font-smoothing: antialiased;
}

/* ============ Header ============ */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 52px; display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand-logo {
  width: 26px; height: 26px; border-radius: 7px; background: var(--accent);
  display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
}
.brand-logo svg { width: 14px; height: 14px; }
.brand-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand-text h1 { font-size: 14px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.brand-text .sep { color: var(--text-3); font-size: 12px; }
.brand-text .tag { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 30px; height: 30px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.icon-btn svg { width: 15px; height: 15px; }

/* ============ Layout ============ */
.container { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
  transition: background .3s, border-color .3s;
}
.card-title {
  font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: -.01em;
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}
.card-title .title-bar { width: 3px; height: 14px; border-radius: 2px; background: var(--accent); }

/* ============ Segmented tabs ============ */
.input-tabs {
  display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 3px; margin-bottom: 16px;
}
.tab-btn {
  flex: 1; padding: 7px 12px; border: none; background: transparent; border-radius: 6px;
  cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-2);
  transition: all .15s; font-family: inherit;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm), 0 0 0 1px var(--border); font-weight: 500; }

/* ============ Inputs ============ */
.tab-pane { display: none; }
.tab-pane.active { display: block; animation: fade .2s ease; }
textarea, input[type="text"] {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text);
  line-height: 1.7; transition: border-color .15s, box-shadow .15s; outline: none; resize: vertical;
}
textarea::placeholder, input::placeholder { color: var(--text-3); }
textarea { min-height: 150px; }
textarea:focus, input[type="text"]:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.hint-line { margin-top: 10px; font-size: 12px; color: var(--text-3); display: flex; gap: 6px; flex-wrap: wrap; }
.hint-line code {
  font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
}

/* ============ Drop zone ============ */
.drop-zone {
  border: 1.5px dashed var(--border-strong); border-radius: var(--radius-sm);
  padding: 36px 20px; text-align: center; cursor: pointer; transition: all .15s; background: var(--surface-3);
}
.drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
.drop-zone .dz-ico { font-size: 26px; display: block; margin-bottom: 8px; }
.drop-zone .dz-main { font-size: 13px; color: var(--text-2); font-weight: 500; }
.drop-zone .dz-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }

/* ============ Buttons & status ============ */
.btn-row { display: flex; gap: 16px; align-items: center; margin-top: 18px; }
.btn {
  padding: 8px 18px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 7px;
  font-family: inherit; letter-spacing: .01em;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { transform: translateY(1px); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 13px; height: 13px; }
.status-wrap { display: flex; align-items: center; gap: 12px; flex: 1; }
.status-badge {
  font-size: 12.5px; font-weight: 500; padding: 4px 10px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 7px; width: fit-content;
  border: 1px solid transparent; transition: all .25s;
}
.status-badge.idle { color: var(--text-3); background: transparent; border-color: var(--border); }
.status-badge.running { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-border); }
.status-badge.done { color: var(--green); background: var(--green-soft); border-color: var(--green-border); }
.status-badge.error { color: var(--red); background: var(--red-soft); border-color: var(--red-border); }
.spinner {
  width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor;
  border-top-color: transparent; animation: spin .7s linear infinite; display: none;
}
.status-badge.running .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress-bar { height: 2px; border-radius: 2px; background: var(--surface-2); overflow: hidden; display: none; flex: 1; }
.progress-bar.on { display: block; }
.progress-bar i { display: block; height: 100%; width: 35%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; border-radius: 2px; }
@keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

/* ============ Result tabs ============ */
.res-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.res-tab {
  padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--text-3); transition: color .15s; background: none;
  border: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
  display: flex; align-items: center; gap: 6px; font-family: inherit;
}
.res-tab:hover { color: var(--text); }
.res-tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.res-pane { display: none; }
.res-pane.active { display: block; animation: fade .25s ease; }

/* ============ Flomo note ============ */
.flomo-note { font-size: 13.5px; line-height: 1.85; }
.flomo-note .tag-line { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.flomo-note .tag-line span {
  font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px;
  background: var(--accent-soft); border: 1px solid var(--accent-border); color: var(--accent);
}
.flomo-note .bold-title {
  font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 4px;
  color: var(--text);
}
.flomo-note .source { color: var(--text-3); font-size: 12px; margin-bottom: 14px; }
.flomo-note .concept { margin-bottom: 8px; }
.flomo-note .subconcept { margin-bottom: 4px; padding-left: 14px; position: relative; color: var(--text-2); }
.flomo-note .subconcept::before {
  content: ""; position: absolute; left: 2px; top: 11px; width: 5px; height: 5px;
  border-radius: 1.5px; background: var(--text-3);
}
.flomo-note mark {
  background: var(--mark-bg); color: var(--mark-text); padding: 0 2px;
  border-radius: 3px; font-weight: 500;
}
.flomo-note strong { font-weight: 700; color: var(--text); }
.note-meta {
  margin-top: 14px; padding: 8px 12px; background: var(--green-soft);
  border: 1px solid var(--green-border); border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--green); font-weight: 500; display: flex; align-items: center; gap: 8px;
}

/* ============ Compare ============ */
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.compare-col { min-width: 0; }
.compare-label {
  font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  margin-bottom: 8px; color: var(--text-3);
}
.compare-label.new { color: var(--accent); }
.compare-label.old { color: var(--orange); }
.compare-panel {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px 16px; max-height: 440px; overflow-y: auto; font-size: 12.5px; line-height: 1.8;
}
.compare-panel mark { background: var(--mark-bg); color: var(--mark-text); padding: 0 2px; border-radius: 3px; }
.decision-bar {
  padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500;
  background: var(--accent-soft); border: 1px solid var(--accent-border);
}
.decision-bar.force-new { background: color-mix(in srgb, var(--blue) 8%, var(--surface)); border-color: color-mix(in srgb, var(--blue) 30%, transparent); color: var(--blue); }
.decision-bar.update { background: var(--orange-soft); border-color: var(--orange-border); color: var(--orange); }
.decision-bar.skip { background: var(--surface-2); border-color: var(--border); color: var(--text-2); }
.decision-icon { font-size: 14px; }
.relevance-line { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12.5px; color: var(--text-2); }
.relevance-badge {
  font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px;
}
.relevance-high { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); }
.relevance-low { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-border); }

/* ============ Log ============ */
.raw-log {
  background: var(--code-bg); color: var(--code-text); padding: 14px 16px;
  border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 11.5px;
  line-height: 1.7; white-space: pre-wrap; word-break: break-all;
  overflow-x: auto; max-height: 520px; overflow-y: auto;
}
.raw-log::-webkit-scrollbar { width: 8px; }
.raw-log::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
.raw-log::-webkit-scrollbar-track { background: transparent; }

/* ============ Misc ============ */
.empty-state { color: var(--text-3); font-size: 13px; text-align: center; padding: 32px 0; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fade .25s ease; }

@media (max-width: 680px) {
  .container { padding: 20px 12px 60px; }
  .card { padding: 18px; }
  .compare-grid { grid-template-columns: 1fr; }
  .brand-text .sep, .brand-text .tag { display: none; }
  .btn-row { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>mynews</h1>
      <span class="sep">/</span>
      <span class="tag">知识笔记处理器</span>
    </div>
  </div>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换夜色模式">
    <svg id="themeIcoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
    <svg id="themeIcoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
</div>

<div class="container">

<div class="card fade-in">
  <div class="card-title"><span class="title-bar"></span> 输入内容</div>
  <div class="input-tabs">
    <button class="tab-btn active" onclick="switchTab('text')">📝 正文</button>
    <button class="tab-btn" onclick="switchTab('url')">🔗 URL</button>
    <button class="tab-btn" onclick="switchTab('image')">🖼️ 图片</button>
  </div>
  <div id="tab-text" class="tab-pane active">
    <textarea id="content" placeholder="粘贴文章正文或笔记内容…"></textarea>
    <div class="hint-line">
      允许 <code>**加粗**</code> <code>&lt;mark&gt;高亮&lt;/mark&gt;</code> <code>- 列表</code>
      · 禁止 <code># 标题</code> <code>链接</code> <code>表格</code> <code>引用</code>
    </div>
  </div>
  <div id="tab-url" class="tab-pane">
    <input type="text" id="url" placeholder="https://example.com/article">
    <div class="hint-line">自动抓取网页正文后交给 AI 分析</div>
  </div>
  <div id="tab-image" class="tab-pane">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="dz-ico">🖼️</span>
      <div class="dz-main">点击上传或拖拽图片</div>
      <div class="dz-sub">JPG / PNG / WebP · AI 自动提取文字</div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="previewImage(event)">
    </div>
    <div id="imagePreview" style="display:none;margin-top:14px;position:relative">
      <img id="previewImg" style="max-width:100%;max-height:280px;border-radius:10px;border:1px solid var(--border)">
      <button class="btn" style="position:absolute;top:8px;right:8px;padding:5px 10px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px" onclick="clearImage()">✕ 移除</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="submitBtn" onclick="process()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
      处理并上传
    </button>
    <div class="status-wrap">
      <span class="status-badge idle" id="status"><span class="spinner"></span> 就绪</span>
      <div class="progress-bar" id="progressBar"><i></i></div>
    </div>
  </div>
</div>

<div id="result-section" style="display:none">
  <div class="card fade-in">
    <div class="res-tabs">
      <button class="res-tab active" onclick="switchRes('note')">📄 笔记</button>
      <button class="res-tab" onclick="switchRes('compare')">🔍 对比</button>
      <button class="res-tab" onclick="switchRes('log')">📋 日志</button>
    </div>
    <div id="res-note" class="res-pane active"></div>
    <div id="res-compare" class="res-pane"></div>
    <div id="res-log" class="res-pane"></div>
  </div>
</div>

</div>

<script>
function toggleTheme() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('themeIcoMoon').style.display = isDark ? 'none' : 'block';
  document.getElementById('themeIcoSun').style.display = isDark ? 'block' : 'none';
  localStorage.setItem('mynews-theme', isDark ? 'dark' : 'light');
}
(function() {
  if (localStorage.getItem('mynews-theme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeIcoMoon').style.display = 'none';
    document.getElementById('themeIcoSun').style.display = 'block';
  }
})();

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick*="'${tab}'"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}
function switchRes(tab) {
  document.querySelectorAll('.res-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.res-pane').forEach(t => t.classList.remove('active'));
  document.querySelector(`.res-tab[onclick*="'${tab}'"]`).classList.add('active');
  document.getElementById(`res-${tab}`).classList.add('active');
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderFlomoNote(text) {
  let html = '<div class="flomo-note">';
  for (const line of text.split('\n')) {
    if (line.startsWith('#')) {
      const tags = line.split(/\s+/).filter(Boolean).map(t => `<span>${escapeHtml(t)}</span>`).join('');
      html += `<div class="tag-line">${tags}</div>`;
    } else if (/^\*\*.*\*\*$/.test(line.trim()) && !line.includes('**来源**') && !line.includes('**概念**') ) {
      html += `<div class="bold-title">${escapeHtml(line).replace(/\*\*/g, '')}</div>`;
    } else if (line.startsWith('**来源**')) {
      html += `<div class="source">${escapeHtml(line)}</div>`;
    } else if (line.startsWith('**概念**')) {
      html += `<div class="concept">${line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/<mark>(.*?)<\/mark>/g, '<mark>$1</mark>')}</div>`;
    } else if (line.startsWith('- ')) {
      html += `<div class="subconcept">${line.slice(2).replace(/<mark>(.*?)<\/mark>/g, '<mark>$1</mark>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>`;
    } else if (line.trim() === '') {
      html += '<div style="height:6px"></div>';
    } else {
      html += `<div>${escapeHtml(line)}</div>`;
    }
  }
  html += '</div>';
  return html;
}

function parseMarkers(text) {
  const sections = {};
  const m1 = text.match(/==BEGIN_FLOMO_NOTE==\n([\s\S]*?)==END_FLOMO_NOTE==/);
  if (m1) sections.flomoNote = m1[1].trim();
  const m2 = text.match(/==BEGIN_OLD_MARKDOWN==\n([\s\S]*?)==END_OLD_MARKDOWN==/);
  if (m2) sections.oldNote = m2[1].trim();
  const m3 = text.match(/==BEGIN_NEW_MARKDOWN==\n([\s\S]*?)==END_NEW_MARKDOWN==/);
  if (m3) sections.newNote = m3[1].trim();
  const m4 = text.match(/旧笔记 id=([a-zA-Z0-9_]+)/);
  if (m4) sections.oldId = m4[1];
  const m5 = text.match(/上传成功 id=([a-zA-Z0-9_]+)/);
  if (m5) sections.newId = m5[1];
  const m6 = text.match(/relevance=([\d.]+)/);
  if (m6) sections.relevance = parseFloat(m6[1]);
  const m7 = text.match(/\[auto\] AI 决定：(.+?)(?:\n|$)/);
  if (m7) sections.aiDecision = m7[1].trim();
  return sections;
}

function renderResults(data) {
  const sections = parseMarkers(data.output || '');
  const log = data.output || '';

  // Note tab
  const noteDiv = document.getElementById('res-note');
  if (sections.flomoNote) {
    noteDiv.innerHTML = renderFlomoNote(sections.flomoNote);
    if (sections.newId) noteDiv.innerHTML += `<div class="note-meta">✓ 已上传 · flomo ID: ${escapeHtml(sections.newId)}</div>`;
  } else if (data.success) {
    const skipped = (data.output || '').includes('无增量 → 跳过') || (data.output || '').includes('已跳过');
    noteDiv.innerHTML = skipped
      ? '<div class="empty-state">⏭️ 已跳过（与已有笔记重复，无增量）</div>'
      : '<div class="empty-state">✓ 已上传成功</div>';
  } else {
    noteDiv.innerHTML = '<div class="empty-state" style="color:var(--red)">处理未完成，请查看日志</div>';
  }

  // Compare tab
  const compDiv = document.getElementById('res-compare');
  if (sections.oldNote) {
    let html = '';
    if (sections.relevance !== undefined) {
      const pct = Math.round(sections.relevance * 100);
      const cls = sections.relevance >= 0.9 ? 'relevance-high' : 'relevance-low';
      html += `<div class="relevance-line">与已有笔记相似度 <span class="relevance-badge ${cls}">${pct}%</span></div>`;
    }
    if (sections.aiDecision) {
      const isForceNew = sections.aiDecision.includes('强制新建');
      const isUpdate = sections.aiDecision.includes('更新');
      const isSkip = sections.aiDecision.includes('跳过');
      let cls = 'skip', icon = '⏭️';
      if (isForceNew) { cls = 'force-new'; icon = '🆕'; }
      else if (isUpdate) { cls = 'update'; icon = '📝'; }
      html += `<div class="decision-bar ${cls}"><span class="decision-icon">${icon}</span> ${escapeHtml(sections.aiDecision)}</div>`;
    }
    html += '<div class="compare-grid">' +
      '<div class="compare-col"><div class="compare-label new">新内容</div><div class="compare-panel">' + renderFlomoNote(sections.newNote || '(无)') + '</div></div>' +
      '<div class="compare-col"><div class="compare-label old">已有笔记</div><div class="compare-panel">' + renderFlomoNote(sections.oldNote) + '</div></div>' +
      '</div>';
    compDiv.innerHTML = html;
  } else {
    compDiv.innerHTML = '<div class="empty-state">未检测到相似笔记，已直接上传</div>';
  }

  // Log tab
  document.getElementById('res-log').innerHTML = `<div class="raw-log">${escapeHtml(log)}</div>`;
  document.getElementById('result-section').style.display = 'block';
}

let uploadedFile = null;

function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  uploadedFile = file;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('previewImg').src = ev.target.result;
    document.getElementById('imagePreview').style.display = 'block';
    document.getElementById('dropZone').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  uploadedFile = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('dropZone').style.display = 'block';
}

// Drag & drop support
const dropZone = document.getElementById('dropZone');
if (dropZone) {
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      document.getElementById('fileInput').files = e.dataTransfer.files;
      previewImage({ target: { files: [file] } });
    }
  });
}

async function process() {
  const content = document.getElementById('content').value.trim();
  const url = document.getElementById('url').value.trim();
  const hasImage = !!uploadedFile;

  if (!content && !url && !hasImage) {
    setStatus('请填写内容或上传图片', 'error');
    return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerHTML = '处理中…';
  setStatus('AI 分析中…', 'running');
  document.getElementById('progressBar').classList.add('on');
  document.getElementById('result-section').style.display = 'none';

  let body;
  const headers = {};
  if (hasImage) {
    const fd = new FormData();
    fd.append('image', uploadedFile);
    body = fd;
  } else {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify({ content, url });
  }

  try {
    const resp = await fetch('/process', {
      method: 'POST',
      headers: headers,
      body: body
    });
    const data = await resp.json();
    renderResults(data);
    setStatus(data.success ? (data.output.includes('跳过') ? '已跳过（重复）' : '处理完成') : '处理失败',
              data.success ? 'done' : 'error');
  } catch (e) {
    document.getElementById('res-log').innerHTML = `<div class="raw-log">请求失败: ${escapeHtml(e.message)}</div>`;
    document.getElementById('result-section').style.display = 'block';
    setStatus('网络错误', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg> 处理并上传';
    document.getElementById('progressBar').classList.remove('on');
  }
}

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.innerHTML = `<span class="spinner"></span> ${text}`;
  el.className = `status-badge ${cls}`;
}
</script>
</body>
